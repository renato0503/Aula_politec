<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; connect-src 'none'; img-src 'self' data: blob:; worker-src blob:">
<title>Mapa de Distribuição</title>
<style>
:root{
  --bg:#f3f5f9;--painel:#fff;--painel-2:#f8fafc;--ink:#14213d;--ink2:#55627a;--linha:#dfe4ec;
  --verde:#127a45;--ambar:#a35f00;--vermelho:#b42318;--ouro:#c99a2e;
  --accent:#047857;--accent-forte:#035640;--accent-ink:#fff;
  --accent-suave:color-mix(in srgb,var(--accent) 10%,var(--painel));
  --ambar-suave:color-mix(in srgb,var(--ambar) 10%,var(--painel));
  --vermelho-suave:color-mix(in srgb,var(--vermelho) 10%,var(--painel));
  --topo-gov:linear-gradient(120deg,#061f3d,#0a2f5c 45%,#12487f);
  --topo-app:linear-gradient(120deg,#035640,#047857);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --raio:4px;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0a1424;--painel:#101e34;--painel-2:#0d192c;--ink:#e7edf6;--ink2:#9fb0c8;--linha:#22324b;
  --verde:#4cc283;--ambar:#f0b44c;--vermelho:#ff8a80;
  --accent:#6ee7b7;--accent-forte:#6ee7b7;--accent-ink:#06241a;
  --topo-gov:linear-gradient(120deg,#040f20,#071a35 55%,#0b2a52);
  --topo-app:linear-gradient(120deg,#02352a,#035640);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--ui);min-height:100vh;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.gov{background:var(--topo-gov);color:#fff;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:7px 20px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.gov .cores{display:inline-flex;gap:2px}
.gov .cores i{width:9px;height:9px;display:block}
.gov span{color:rgba(255,255,255,.76)}
.topo{background:var(--topo-app);color:#fff;border-bottom:3px solid var(--ouro);padding:9px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.emblema{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--ouro);border-radius:var(--raio);background:rgba(255,255,255,.1);flex:none}
.marca{font-size:16px;font-weight:700;line-height:1.2;min-width:0;flex:1 1 240px}
.marca small{display:block;font-size:12px;font-weight:400;color:rgba(255,255,255,.8)}
.topo .acoes{display:flex;gap:8px}
.btn-cab{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.4);border-radius:var(--raio);color:#fff;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600}
.btn-cab:hover{background:rgba(255,255,255,.2)}

.passos{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:4px;padding:6px 20px;background:var(--painel);border-bottom:1px solid var(--linha);overflow-x:auto}
.passos[hidden]{display:none}
.passos a{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;font-size:13px;color:var(--ink2);text-decoration:none;border-radius:var(--raio);white-space:nowrap}
.passos a:not(.voltar){text-transform:uppercase}
.passos a:hover{background:var(--accent-suave);color:var(--accent)}
.passos a .n{display:grid;place-items:center;width:18px;height:18px;border-radius:3px;background:var(--painel-2);border:1px solid var(--linha);font-size:11px;font-weight:700}
.passos a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.passos a[aria-current="page"] .n{background:var(--accent-ink);color:var(--accent);border-color:transparent}
.passos .voltar{font-weight:700;color:var(--accent);border-right:1px solid var(--linha);border-radius:0;margin-right:4px}

main{width:100%;max-width:1500px;margin:0 auto;padding:18px 20px 40px;flex:1;outline:none}
h1{margin:0;font-size:22px;line-height:1.25;padding-left:10px;border-left:4px solid var(--accent)}
.sub{margin:4px 0 0;color:var(--ink2)}
h2{font-size:16px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:14px 0}
.kpi{background:var(--painel);border:1px solid var(--linha);border-radius:var(--raio);padding:10px 12px;min-width:0}
.kpi span{display:block;font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.kpi b{display:block;font:700 19px/1.25 var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{color:var(--ink2);font-size:12px}
.filtros{display:grid;grid-template-columns:minmax(220px,2fr) repeat(3,minmax(140px,1fr)) auto;gap:8px;align-items:end;background:var(--painel);border:1px solid var(--linha);border-radius:var(--raio);padding:10px 12px;margin-bottom:6px}
label.campo{display:block;font-size:12px;font-weight:600;color:var(--ink2);min-width:0}
label.campo input,label.campo select{display:block;width:100%;margin-top:3px;padding:7px 8px;background:var(--painel-2);border:1px solid var(--linha);border-radius:var(--raio);font-weight:400;color:var(--ink)}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding:12px}
.btn{display:inline-block;padding:7px 12px;background:var(--painel);border:1px solid var(--linha);border-radius:var(--raio);cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none}
.btn:hover{background:var(--accent-suave)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.prim:hover{background:var(--accent-forte)}
.btn.perigo{color:var(--vermelho);border-color:var(--vermelho)}
label.btn:focus-within{outline:2px solid var(--ouro);outline-offset:2px}
.visual-oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.btn-icone{display:grid;place-items:center;width:32px;height:32px;margin-left:auto;padding:0;background:var(--painel);border:1px solid var(--linha);border-radius:var(--raio);color:var(--ink2);cursor:pointer}
.btn-icone:hover{background:var(--accent-suave);color:var(--accent)}
.botoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.contagem{margin:8px 0 12px;color:var(--ink2);font-size:13px}

.cartao{background:var(--painel);border:1px solid var(--linha);border-radius:var(--raio);margin:0 0 12px}
.corpo{padding:12px}
.cab-grupo{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--linha)}
.cab-grupo .emp{min-width:0;flex:1 1 280px}
.cab-grupo .emp small{display:block;color:var(--ink2);font-size:12px}
.cab-grupo .valor{text-align:right;margin-left:auto}
.cab-grupo .valor small{display:block;color:var(--ink2);font-size:12px}
.cab-grupo .valor b{font:700 15px var(--mono)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--linha);white-space:nowrap}
.tag.ok{color:var(--verde);border-color:var(--verde)}
.tag.fra{color:var(--ambar);border-color:var(--ambar);background:var(--ambar-suave)}
.tag.erro{color:var(--vermelho);border-color:var(--vermelho)}
.rolagem{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--linha);padding:5px 8px;vertical-align:top;text-align:left}
th{background:var(--painel-2);font-size:11.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
th.org{text-align:center;background:var(--accent-suave);color:var(--accent-forte)}
td.num,th.num{text-align:right;white-space:nowrap}
td.centro,th.centro{text-align:center}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--painel-2) 55%,transparent)}
tr.subtotal td{background:var(--accent-suave)!important;font-weight:700}
tr.total td{background:color-mix(in srgb,var(--accent) 18%,var(--painel))!important;font-weight:700}
.grade-itens th,.grade-itens td{vertical-align:middle}
.desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%;min-width:300px;padding:0;margin:0;background:none;border:0;text-align:justify;cursor:pointer;line-height:1.35;font-size:12px}
.desc[aria-expanded="true"]{display:block;overflow:visible}
.desc:hover{color:var(--accent)}
.zero{color:var(--ink2)}
.caixa{border-left:4px solid var(--accent);background:var(--accent-suave);padding:10px 12px;margin:12px 0;border-radius:0 var(--raio) var(--raio) 0}
.caixa.aviso{border-left-color:var(--ambar);background:var(--ambar-suave)}
.caixa.erro{border-left-color:var(--vermelho);background:var(--vermelho-suave)}
.caixa p{margin:0}
.vazio{background:var(--painel);border:1px dashed var(--linha);border-radius:var(--raio);padding:24px;text-align:center;color:var(--ink2);margin-bottom:12px}
details.cartao>summary{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:9px 12px;cursor:pointer;font-weight:600}
details.cartao>summary .num{margin-left:auto}
details[open].cartao>summary{border-bottom:1px solid var(--linha)}
.dot{font:11px/1.3 var(--mono);font-weight:400;overflow-wrap:anywhere;white-space:normal;display:block;min-width:190px;color:var(--ink)}
.emp-cel small{display:block;color:var(--ink2);font-family:var(--mono);font-size:12px}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--linha)}
.lista li:last-child{border-bottom:0}
.lista .tag{flex:none;min-width:76px;text-align:center}
.lista b{display:block}
.lista small{color:var(--ink2);font-size:12.5px;display:block;overflow-wrap:anywhere}
input.cod{display:block;width:100%;min-width:230px;margin-top:3px;padding:5px 6px;background:var(--painel-2);border:1px solid var(--linha);border-radius:var(--raio);font:12px var(--mono);font-weight:400;color:var(--ink)}
input.cod.falta{border-color:var(--ambar);background:var(--ambar-suave)}
.tag.definir{color:#5b3fa8;border-color:#5b3fa8;background:color-mix(in srgb,#5b3fa8 10%,var(--painel))}
:root[data-theme="dark"] .tag.definir{color:#c4b5fd;border-color:#c4b5fd}
.lanc{margin-top:6px}
.parc{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:flex-end;padding:6px;margin-bottom:4px;background:var(--painel-2);border:1px dashed var(--linha);border-radius:var(--raio)}
.parc-campo{display:block;font-size:11px;font-weight:600;color:var(--ink2);width:64px}
.parc-campo:nth-child(2){width:96px}
.parc-campo.parc-cod{flex:1 1 180px;width:auto}
.parc-campo input{display:block;width:100%;margin-top:2px;padding:4px 5px;background:var(--painel);border:1px solid var(--linha);border-radius:var(--raio);font:12px var(--mono);color:var(--ink)}
.parc-numero::placeholder{color:#5b3fa8;font-weight:700;opacity:1}
:root[data-theme="dark"] .parc-numero::placeholder{color:#c4b5fd}
.btn-mini{padding:2px 8px;background:var(--painel);border:1px solid var(--linha);border-radius:var(--raio);cursor:pointer;font-size:12px;color:var(--ink);line-height:1.5}
.btn-mini:hover{background:var(--accent-suave)}
.btn-mini.texto{margin-top:2px;color:var(--accent);font-weight:600}
.resto{display:block;margin:2px 0;font-size:11.5px;color:var(--ink2)}
.resto.erro{color:var(--vermelho);font-weight:600}
.dica{display:block;margin-top:4px;font-size:11.5px;color:var(--ambar);max-width:320px}
tr[hidden]{display:none}
.saidas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.saidas .cartao{margin:0;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.saidas p{margin:0;color:var(--ink2);flex:1}
#avisoToast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(92vw,560px);background:#14213d;color:#fff;border-left:4px solid var(--ouro);padding:10px 14px;border-radius:var(--raio);z-index:50}
#avisoToast[hidden]{display:none}
footer{padding:12px 20px 24px;color:var(--ink2);font-size:12px;border-top:1px solid var(--linha);display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between}
@media(max-width:900px){.filtros{grid-template-columns:1fr 1fr}.filtros .amplo{grid-column:1/-1}}
@media(max-width:520px){.filtros{grid-template-columns:1fr}main{padding:14px 12px 32px}.passos{padding:6px 12px}.gov,.topo{padding-left:12px;padding-right:12px}}
@media print{
  @page{size:A4 landscape;margin:10mm}
  :root{--bg:#fff}
  body{font-size:11px;display:block}
  .passos,.filtros,.acoes,.contagem,.botoes,.btn-icone,#avisoToast{display:none!important}
  .gov,.topo{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  main{max-width:none;padding:8px 0}
  .rolagem{overflow:visible}
  .desc{-webkit-line-clamp:unset;display:block;min-width:0}
  tr{break-inside:avoid}
}
</style>
<!-- LIB:xlsx.full.min.js -->
</head>
<body>
<div class="gov"><span class="cores" aria-hidden="true"><i style="background:#1e63ae"></i><i style="background:#c99a2e"></i><i style="background:#0b7a3e"></i></span><b>Governo de Mato Grosso</b><span>Secretaria de Estado de Segurança Pública</span><span><b>POLITEC</b> · Perícia Oficial e Identificação Técnica</span></div>
<header class="topo">
  <div class="emblema" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M3 15h18M9 4v16"/></svg></div>
  <div class="marca">Mapa de Distribuição<small id="subtitulo">Importe uma planilha para montar o mapa</small></div>
  <div class="acoes">
    <button class="btn-cab" id="btnImprimir" type="button">Imprimir</button>
    <button class="btn-cab" id="btnTema" type="button" aria-pressed="false">Tema escuro</button>
  </div>
</header>
<nav class="passos" id="passos" aria-label="Etapas do processo" hidden></nav>
<main id="tela" tabindex="-1"></main>
<div id="avisoToast" role="status" aria-live="polite" hidden></div>
<footer>
  <span id="fonte"></span>
  <span>Dados guardados só neste navegador. Funciona sem internet e não envia dados.</span>
</footer>
<script>
"use strict";
/* ---------- Utilidades ---------- */
const fN = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 3 });
const fM = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const c = v => Math.round((Number(v) || 0) * 100);
const r2 = v => Math.round((Number(v) || 0) * 100) / 100;
const real = v => "R$ " + fM.format(v);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const soma = (l, f) => l.reduce((a, x) => a + c(f(x)), 0) / 100;
const somaQ = (l, f) => l.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const dinheiro = v => (c(v) === 0 ? '<span class="zero">0,00</span>' : fM.format(v));
const sem = s => String(s == null ? "" : s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const norm = s => sem(s).trim().replace(/\s+/g, " ");
const limpa = s => String(s == null ? "" : s).replace(/\s+/g, " ").trim();
const pct = (a, b) => (b ? (a / b * 100).toFixed(1).replace(".", ",") + "%" : "0%");
const agora = () => new Date().toLocaleString("pt-BR");
function num(v) {
  if (typeof v === "number") return Number.isFinite(v) ? v : null;
  let s = String(v == null ? "" : v).replace(/R\$/gi, "").replace(/\s/g, "");
  if (!s) return null;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}
function cnpjValido(v) {
  const d = String(v).replace(/\D/g, "");
  if (d.length !== 14 || /^(\d)\1+$/.test(d)) return false;
  const dig = n => {
    let s = 0, p = n - 7;
    for (let i = 0; i < n; i++) { s += Number(d[i]) * p--; if (p < 2) p = 9; }
    const r = s % 11;
    return r < 2 ? 0 : 11 - r;
  };
  return dig(12) === Number(d[12]) && dig(13) === Number(d[13]);
}
function separaEmpresa(t) {
  const s = limpa(t);
  const m = s.match(/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/);
  if (!m) return { nome: s, cnpj: "" };
  const nome = s.replace(m[0], "").replace(/\bCNPJ\b\s*(n[º°o.]*)?\s*:?/i, "").replace(/[\s\-–,;:]+$/, "").trim();
  return { nome, cnpj: m[0] };
}
/* Dotação informada: a do item vale sobre a do grupo (primeira coluna do mapa). */
const chaveG = (g, o) => `${g}|${o}`;
const chaveI = (g, i, o) => `${g}|${i}|${o}`;
const limpaCod = s => String(s == null ? "" : s).replace(/\s/g, "");
const dotacaoDe = (p, i, o) => p.dot.itens[chaveI(i.grupo, i.item, o)] || p.dot.grupos[chaveG(i.grupo, o)] || "";
function situacaoDe(t) {
  const n = norm(t);
  if (!n) return "sem";
  if (n.includes("fracassad")) return "fracassado";
  if (n.includes("desert")) return "deserto";
  return "vencedor";
}
const ROTULO_SIT = { vencedor: "Com vencedor", fracassado: "Fracassado", deserto: "Deserto", sem: "Sem resultado" };

/* ---------- Banco local ---------- */
const banco = {
  _db: null,
  abrir() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((ok, erro) => {
      const r = indexedDB.open("mapa_planilha_v1", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("processos", { keyPath: "id" });
      r.onsuccess = () => { this._db = r.result; ok(r.result); };
      r.onerror = () => erro(r.error);
    });
  },
  async _op(modo, f) {
    const d = await this.abrir();
    return new Promise((ok, erro) => {
      const t = d.transaction("processos", modo);
      const r = f(t.objectStore("processos"));
      t.oncomplete = () => ok(r && r.result);
      t.onerror = () => erro(t.error);
    });
  },
  listar() { return this._op("readonly", s => s.getAll()); },
  ler(id) { return this._op("readonly", s => s.get(id)); },
  gravar(p) { return this._op("readwrite", s => s.put(p)); },
  apagar(id) { return this._op("readwrite", s => s.delete(id)); }
};

/* ---------- Leitura das planilhas ---------- */
const linhasDe = ws => XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "", blankrows: true });
function grupoTexto(v) {
  if (typeof v === "number") return String(Math.round(v * 100) / 100);
  const s = String(v == null ? "" : v).trim().replace(",", ".");
  return /^\d+(\.\d+)?$/.test(s) ? s : "";
}
function ultimoNumero(l) {
  for (let j = l.length - 1; j >= 0; j--) { const n = num(l[j]); if (n != null) return n; }
  return null;
}

function interpretar(livro, arquivo) {
  const visiveis = livro.SheetNames.filter((n, i) => !(livro.Workbook && livro.Workbook.Sheets && livro.Workbook.Sheets[i] && livro.Workbook.Sheets[i].Hidden));
  let origem = null;
  for (const aba of visiveis) {
    if (norm(aba).includes("dotacao")) continue;
    const linhas = linhasDe(livro.Sheets[aba]);
    for (let r = 0; r < linhas.length; r++) {
      const n = linhas[r].map(norm);
      if (n.includes("grupo") && n.includes("item") && n.some(x => /^qtd\.? .+/.test(x))) { origem = { aba, linhas, tipo: "itens" }; break; }
      if (ehCabMapa(linhas[r], linhas[r + 1])) { origem = { aba, linhas, tipo: "mapa" }; break; }
    }
    if (origem) break;
  }

  const d = { arquivo, aba: origem.aba, layout: origem.tipo, processo: "", pregao: "", objeto: "", titulo: "", orgaos: [], grupos: [], itens: [], apuracao: [], resumo: { orgaos: {} }, dotacao: null, avisos: [], recusadas: [] };

/* ---------- Relatório do pregoeiro (PDF) ---------- */
async function inflar(bytes) {
  const leitor = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate")).getReader();
  const partes = [];
  try {
    for (;;) { const { done, value } = await leitor.read(); if (done) break; partes.push(value); }
  } catch (e) { if (!partes.length) throw e; }
  return new Uint8Array(await new Blob(partes).arrayBuffer());
}
function desfazEscapes(s) {
  return s.replace(/\\([0-7]{1,3}|[\s\S])/g, (m, x) => {
    if (/^[0-7]/.test(x)) return String.fromCharCode(parseInt(x, 8));
    return { n: "\n", r: "\r", t: "\t", b: "\b", f: "\f" }[x] || x;
  });
}
/* Lê o texto com a posição de cada trecho. Serve para PDFs gerados por sistema, não para digitalizados. */
async function textoDoPdf(buf) {
  const dec = new TextDecoder("windows-1252");
  const bytes = new Uint8Array(buf), bruto = dec.decode(bytes);
  if (!bruto.startsWith("%PDF")) throw new Error("O arquivo não é um PDF válido.");
  if (/\/Encrypt\b/.test(bruto)) throw new Error("O PDF está protegido por senha ou criptografia.");
  const paginas = [], re = /stream\r?\n/g;
  let m;
  while ((m = re.exec(bruto))) {
    const ini = m.index + m[0].length, fim = bruto.indexOf("endstream", ini);
    if (fim < 0) break;
    const dic = bruto.slice(bruto.lastIndexOf(" obj", m.index), m.index);
    re.lastIndex = fim + 9;
    if (/\/Subtype\s*\/Image|DCTDecode/.test(dic)) continue;
    let txt;
    try { txt = dec.decode(/FlateDecode/.test(dic) ? await inflar(bytes.subarray(ini, fim)) : bytes.subarray(ini, fim)); } catch (e) { continue; }
    const itens = [], rt = /([-\d.]+)\s+([-\d.]+)\s+Tm\s*\(((?:\\[\s\S]|[^\\)])*)\)\s*Tj/g;
    let t;
    while ((t = rt.exec(txt))) itens.push({ x: Number(t[1]), y: Number(t[2]), t: desfazEscapes(t[3]) });
    if (itens.length) paginas.push(itens);
  }
  if (!paginas.length) throw new Error("Não encontrei texto no PDF. Ele pode ser digitalizado (imagem), e este leitor só funciona com o relatório gerado pelo sistema.");
  return paginas;
}
function interpretarRelatorio(paginas, arquivo) {
  const p0 = paginas[0];
  if (!p0.some(i => norm(i.t).includes("relatorio de resultado"))) throw new Error("Não parece um Relatório de Resultado: faltou o título do documento.");
  const abaixo = rx => {
    const r = p0.find(i => rx.test(norm(i.t)));
    if (!r) return "";
    const v = p0.filter(i => Math.abs(i.x - r.x) < 6 && i.y < r.y && r.y - i.y < 18).sort((a, b) => b.y - a.y)[0];
    return v ? limpa(v.t) : "";
  };
  const rel = {
    arquivo, autorizacao: abaixo(/autorizacao/), processo: abaixo(/processo$/), orgao: abaixo(/^orgao$/),
    empresa: abaixo(/razao social/), cnpj: abaixo(/cpf\/cnpj|^cnpj/), itens: [], totalRelatorio: null
  };
  if (!rel.empresa) throw new Error("Não encontrei o fornecedor no relatório.");
  let dentro = false, atual = null;
  const R$ = s => /^R\$/.test(limpa(s));
  paginas.forEach(pag => {
    const grupos = new Map();
    pag.filter(i => i.y > 30 && i.y < 520).forEach(i => {
      const k = Math.round(i.y);
      const c0 = [k, k - 1, k + 1].find(z => grupos.has(z));
      const ch = c0 != null ? c0 : k;
      if (!grupos.has(ch)) grupos.set(ch, []);
      grupos.get(ch).push(i);
    });
    [...grupos.keys()].sort((a, b) => b - a).forEach(k => {
      const l = grupos.get(k).sort((a, b) => a.x - b.x), n = l.map(i => norm(i.t));
      if (!dentro) { if (n.some(x => x.includes("resultado dos itens"))) dentro = true; return; }
      if (rel.totalRelatorio != null) return;
      if (n.includes("seq.") || n.some(x => x.startsWith("seq"))) return;
      if (n[0] === "valor total") { rel.totalRelatorio = num(l.find(i => R$(i.t)) ? l.find(i => R$(i.t)).t : ""); atual = null; return; }
      const tp = l[0].x < 115 ? limpa(l[0].t).match(/^(grupo|lote|item)\b\s*([\d.,]*)$/i) : null;
      if (tp) {
        const seq = l.find(i => i.x >= 100 && i.x < 180 && /^\d+$/.test(limpa(i.t)));
        const desc = l.find(i => i.x >= 180 && i.x < 385);
        const resto = l.filter(i => i.x >= 385);
        const reais = resto.filter(i => R$(i.t));
        const qtd = resto.find(i => !R$(i.t) && num(i.t) != null && i.x < 455);
        const un = resto.find(i => !R$(i.t) && i.x >= 450 && i.x < 520);
        atual = {
          grupo: (tp[2] || "").replace(",", "."), item: seq ? Number(limpa(seq.t)) : null, bruto: desc ? desc.t : "",
          qtd: qtd ? num(qtd.t) : null, unidade: un ? limpa(un.t) : "",
          vu: reais[0] ? num(reais[0].t) : null, total: reais[1] ? num(reais[1].t) : null
        };
        rel.itens.push(atual);
      } else if (atual) {
        l.filter(i => i.x >= 180 && i.x < 385).forEach(i => { atual.bruto += i.t; });
      }
    });
  });
  if (!rel.itens.length) throw new Error("Encontrei o relatório, mas nenhum item na tabela de resultado. O formato pode ser diferente do esperado.");
  rel.itens.forEach(i => {
    const t = limpa(i.bruto), mc = t.match(/^(\S+)\s+-\s+([\s\S]*)$/);
    i.codigo = mc ? mc[1] : "";
    i.descricao = mc ? mc[2] : t;
    delete i.bruto;
  });
  return rel;
}
/* Falta resultado: grupo sem situação, ou grupo com empresa e item ainda sem valor unitário. */
const faltaResultado = p => p.grupos.some(g => g.situacao === "sem" || (g.situacao === "vencedor" && p.itens.some(i => i.grupo === g.grupo && c(i.vu) === 0)));
const outroProcesso = (rel, p) => rel.processo && p.processo && norm(rel.processo) !== norm(p.processo);
const codIgual = (a, b) => String(a).replace(/\D/g, "").replace(/^0+/, "") === String(b).replace(/\D/g, "").replace(/^0+/, "");
/* Casa cada linha do relatório com o mapa: grupo e item primeiro, código como conferência e como alternativa. */
function casarRelatorio(p, rel) {
  return rel.itens.map(r => {
    let alvo = p.itens.find(i => i.grupo === r.grupo && i.item === r.item);
    const obs = [];
    let erro = "";
    if (alvo && r.codigo && alvo.codigo && !codIgual(alvo.codigo, r.codigo)) {
      const noGrupo = p.itens.filter(i => i.grupo === r.grupo && codIgual(i.codigo, r.codigo));
      if (noGrupo.length === 1) { obs.push(`No mapa é o item ${noGrupo[0].item} do grupo, casado pelo código`); alvo = noGrupo[0]; }
      else { erro = `Código ${r.codigo} difere do mapa (${alvo.codigo})`; alvo = null; }
    } else if (!alvo) {
      const porCod = r.codigo ? p.itens.filter(i => codIgual(i.codigo, r.codigo)) : [];
      if (porCod.length === 1) { alvo = porCod[0]; obs.push(`Casado pelo código com o grupo ${alvo.grupo} item ${alvo.item}`); }
      else erro = porCod.length > 1 ? `Código ${r.codigo} aparece em ${porCod.length} itens do mapa` : `Grupo ${r.grupo || "?"} item ${r.item == null ? "?" : r.item} não existe no mapa`;
    }
    if (r.vu == null) { erro = erro || "Sem valor unitário no relatório"; alvo = null; }
    if (alvo) {
      if (r.qtd != null && r.qtd !== alvo.qtd) obs.push(`Quantidade: relatório ${fN.format(r.qtd)}, mapa ${fN.format(alvo.qtd)}`);
      const calc = r2(alvo.qtd * r.vu);
      if (r.total != null && c(calc) !== c(r.total)) obs.push(`Total: relatório ${fM.format(r.total)}, calculado ${fM.format(calc)}`);
    }
    return { r, alvo, obs, erro };
  });
}
function aplicarRelatorio(p, rel, soSemResultado) {
  let n = 0;
  casarRelatorio(p, rel).forEach(({ r, alvo }) => {
    if (!alvo) return;
    const g = p.grupos.find(x => x.grupo === alvo.grupo);
    if (soSemResultado && g.situacao !== "sem" && c(alvo.vu) > 0) return;
    alvo.vu = r.vu;
    alvo.total = r2(alvo.qtd * r.vu);
    Object.values(alvo.org).forEach(o => { o.vu = o.q ? r.vu : 0; o.t = r2(o.q * r.vu); });
    alvo.rel = { qtd: r.qtd, total: r.total, autorizacao: rel.autorizacao };
    if (!alvo.codigo) alvo.codigo = r.codigo;
    if (!alvo.descricao) alvo.descricao = r.descricao;
    if (!alvo.unidade) alvo.unidade = r.unidade;
    g.situacao = "vencedor"; g.empresa = rel.empresa; g.cnpj = rel.cnpj;
    g.textoSituacao = rel.cnpj ? `${rel.empresa} CNPJ ${rel.cnpj}` : rel.empresa;
    g.homologado = null; g.totalPlanilha = null;
    n++;
  });
  if (n) { p.resumo = { orgaos: {} }; p.apuracao = []; p.dotacao = null; }
  return n;
}

      const temNovo = (g, o) => novo.grupos[chaveG(g, o)] || Object.keys(novo.itens).some(k => k.startsWith(`${g}|`) && k.endsWith(`|${o}`));
      Object.entries(antigo.dot.grupos).forEach(([k, v]) => { const [g, o] = k.split("|"); if (!temNovo(g, o)) novo.grupos[k] = v; });
      Object.entries(antigo.dot.itens).forEach(([k, v]) => { const [g, , o] = k.split("|"); if (!novo.grupos[chaveG(g, o)] && !novo.itens[k]) novo.itens[k] = v; });
      novo.saldos = { ...antigo.dot.saldos, ...novo.saldos };
      novo.lanc = { ...(antigo.dot.lanc || {}), ...novo.lanc };
      if (!novo.exercicio) novo.exercicio = antigo.dot.exercicio || "";
    }
    const reg = { ...PENDENTE, id, processo, pregao: limpa(document.getElementById("pPregao").value), objeto: limpa(document.getElementById("pObjeto").value), importadoEm: agora(),
      historico: [...((antigo && antigo.historico) || []), { quando: agora(), acao: antigo ? "Importação substituiu os dados" : "Importação", detalhe: PENDENTE.arquivo }] };
    if (antigo && (antigo.relatorios || []).length) {
      /* Mapa importado de novo: os relatórios já aplicados voltam a preencher o que veio em branco. */
      reg.relatorios = antigo.relatorios;
      reg.relatorios.forEach(rel => aplicarRelatorio(reg, rel, true));
    }
    if (antigo) reg.grupos.forEach(g => {
      /* Mantém o fracassado ou deserto marcado na tela quando a planilha nova não diz nada. */
      const a = antigo.grupos.find(x => x.grupo === g.grupo);
      if (g.situacao === "sem" && a && (a.situacao === "fracassado" || a.situacao === "deserto")) { g.situacao = a.situacao; g.textoSituacao = a.textoSituacao; }
    });
    await banco.gravar(reg);
    PENDENTE = null;
    const semRes = faltaResultado(reg);
    const faltam = dotacaoGerada(derivar(reg)).pend.length;
    toast(semRes ? "Processo salvo. Agora importe o relatório do pregoeiro." : (faltam ? "Processo salvo. Agora informe as dotações." : "Processo salvo neste navegador."));
    const destino = `#/p/${encodeURIComponent(id)}/${semRes ? "relatorio" : (faltam ? "dotacao" : "mapa")}`;
    if (location.hash === destino) navegar(true); else location.hash = destino;
  });
}

function agendarDot() {

function codigosEmUso(o) {
  const { p } = ATUAL, s = new Set();
  Object.entries(p.dot.grupos).forEach(([k, v]) => { if (k.split("|")[1] === o && v) s.add(v); });

tela.addEventListener("input", e => {
  const el = e.target;
  if (!ATUAL || !el.matches) return;
  if (el.id === "dotExercicio") {
    const v = limpa(el.value);
    if (!/^20\d{2}$/.test(v)) return;
    ATUAL.p.dot.exercicio = v;
    agendarDot(); atualizarDot(); desenharQuadroDot();
    return;
  }
  const parc = el.closest(".parc");
  if (parc && el.dataset.campo) {
    const l = (ATUAL.p.dot.lanc[parc.dataset.chave] || [])[Number(parc.dataset.idx)];
    if (!l) return;
    if (el.dataset.campo === "valor") l.valor = num(el.value) || 0;
    else if (el.dataset.campo === "codigo") l.codigo = limpaCod(el.value);
    else l.exercicio = limpa(el.value);
    agendarDot(); atualizarDot(); desenharQuadroDot();
    return;
  }
  if (!el.matches("input.cod")) return;
  if (el.dataset.saldo) { ATUAL.p.dot.saldos[el.dataset.saldo] = limpa(el.value); agendarDot(); return; }
  if (el.dataset.g == null) return;
  const o = ATUAL.orgaos[Number(el.dataset.org)], cod = limpaCod(el.value);
  const alvo = el.dataset.i ? ATUAL.p.dot.itens : ATUAL.p.dot.grupos;
  const k = el.dataset.i ? chaveI(el.dataset.g, Number(el.dataset.i), o) : chaveG(el.dataset.g, o);
  if (cod) alvo[k] = cod; else delete alvo[k];
  agendarDot();
  atualizarDot();
  desenharQuadroDot();
});
function desenharLinhasLanc(bloco) {
  const chave = bloco.dataset.lista, k = bloco.dataset.orgk;

tela.addEventListener("click", e => {
  const adicionar = e.target.closest("[data-adicionar]");
  if (adicionar) {
    const b = adicionar.closest(".lanc"), chave = b.dataset.lista, base = Number(exercicioBase(ATUAL.p));
    const r = dotacaoGerada(ATUAL).restos[chave];
    const pt = chave.split("|"), o = pt[pt.length - 1];
    const temCod = pt.length === 3 ? ATUAL.p.dot.itens[chave] : ATUAL.p.dot.grupos[chaveG(pt[0], o)];
    const l = { exercicio: String(base + 1), valor: !temCod && r ? r.resto / 100 : 0, codigo: "" };
    (ATUAL.p.dot.lanc[chave] = ATUAL.p.dot.lanc[chave] || []).push(l);
    desenharLinhasLanc(b);
    agendarDot(); atualizarDot(); desenharQuadroDot();
    const linhas = b.querySelectorAll(".parc");
    linhas[linhas.length - 1].querySelector('[data-campo="valor"]').focus();
    return;
  }
  const remover = e.target.closest("[data-remover]");
  if (remover) {
    const parc = remover.closest(".parc"), b = remover.closest(".lanc"), chave = b.dataset.lista;
    const lista = ATUAL.p.dot.lanc[chave] || [];
    lista.splice(Number(parc.dataset.idx), 1);
    if (!lista.length) delete ATUAL.p.dot.lanc[chave];
    desenharLinhasLanc(b);
    agendarDot(); atualizarDot(); desenharQuadroDot();
    b.querySelector("[data-adicionar]").focus();
    return;
  }
  const abrir = e.target.closest("[data-abrir]");
  if (abrir) {
    const d = document.getElementById("det" + abrir.dataset.abrir);
    d.hidden = !d.hidden;
    abrir.setAttribute("aria-expanded", String(!d.hidden));
    return;
  }
  const ap = e.target.closest("[data-aplicar]");
  if (!ap) return;
  const k = ap.dataset.aplicar, entrada = tela.querySelector(`[data-padrao="${k}"]`), cod = limpaCod(entrada.value);
  if (!cod) { toast("Digite o número da dotação antes de aplicar."); entrada.focus(); return; }
  let n = 0;
  tela.querySelectorAll(`input.cod[data-g][data-org="${k}"]:not([data-i])`).forEach(el => {
    if (el.value) return;
    el.value = cod; ATUAL.p.dot.grupos[chaveG(el.dataset.g, ATUAL.orgaos[Number(k)])] = cod; n++;
  });
  agendarDot(); atualizarDot(); desenharQuadroDot();
  toast(n ? `Dotação aplicada em ${n} ${n === 1 ? "GP" : "GPs"}.` : "Nenhum GP vazio neste órgão.");
});

  tela.innerHTML = `<h1>Exportar</h1>
    <p class="sub">${esc(ATUAL.p.processo)}. Os arquivos são gerados aqui mesmo, no seu computador.</p>
    ${(g => (g.pend.length ? `<div class="caixa aviso"><p><b>${real(g.totalPendente)} de saldo não distribuído.</b> A aba de dotação sai incompleta, com o saldo indicado. <a href="#/p/${encodeURIComponent(ATUAL.p.id)}/dotacao">Distribuir</a></p></div>` : "") + (g.aDefinir.length ? `<div class="caixa"><p><b>${real(g.totalADefinir)} A DEFINIR.</b> O valor entra no total da distribuição e sai identificado como pendente de definição.</p></div>` : ""))(dotacaoGerada(ATUAL))}
    <div style="height:14px"></div>
    <div class="saidas">
      <div class="cartao"><h2>Mapa completo</h2><p>Excel com as abas Processo, Mapa, Dotação Orçamentária, Dotação por item, Apuração por empresa e Conferência. Pode ser importado de novo, com as dotações.</p><button class="btn prim" id="xCompleto" type="button">Baixar mapa (.xlsx)</button></div>
      <div class="cartao"><h2>Planilha de entrada</h2><p>Os dados deste processo no modelo de preenchimento, uma linha por item. É o jeito mais simples de corrigir e importar de novo.</p><button class="btn" id="xEntrada" type="button">Baixar entrada (.xlsx)</button></div>
      <div class="cartao"><h2>Modelo em branco</h2><p>Para começar outro processo: só cabeçalhos, com as instruções na aba Leia-me.</p><button class="btn" id="xModelo" type="button">Baixar modelo (.xlsx)</button></div>
    </div>`;
  const reg = async (acao, detalhe) => {
    const p = await banco.ler(ATUAL.p.id);
    if (!p) return;
    p.historico = [...(p.historico || []), { quando: agora(), acao, detalhe }];
    await banco.gravar(p);
    ATUAL.p.historico = p.historico;
  };
  document.getElementById("xCompleto").addEventListener("click", async () => { exportarCompleto(ATUAL); await reg("Exportação", "Mapa completo"); toast("Mapa completo gerado."); });
  document.getElementById("xEntrada").addEventListener("click", async () => { exportarEntrada(ATUAL); await reg("Exportação", "Planilha de entrada"); toast("Planilha de entrada gerada."); });
  document.getElementById("xModelo").addEventListener("click", () => { baixarModelo(); toast("Modelo em branco gerado."); });
}

/* ---------- Backup ---------- */
const APP_BACKUP = "mapa-distribuicao-planilha";
let LIDO_BK = null;
function baixarJson(conteudo, nome) {
  const url = URL.createObjectURL(new Blob([conteudo], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
const dataArquivo = () => { const d = new Date(), z = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; };
function exportarBackup(lista, nome) {
  baixarJson(JSON.stringify({ app: APP_BACKUP, versao: 1, criadoEm: new Date().toISOString(), processos: lista }, null, 2), nome);
}
/* Recusa o arquivo inteiro se algum processo não puder ser aberto: nada é gravado sem passar por aqui. */
function validarBackup(texto, arquivo) {
  let o;
  try { o = JSON.parse(texto); } catch (e) { throw new Error("O arquivo não é um backup válido: não foi possível ler o conteúdo."); }
  if (!o || o.app !== APP_BACKUP || !Array.isArray(o.processos)) throw new Error("Este arquivo não é um backup do Mapa de Distribuição.");
  if (!o.processos.length) throw new Error("O backup não tem nenhum processo.");
  const processos = o.processos.map((p, n) => {
    const rot = p && p.processo ? `Processo ${p.processo}` : `Processo ${n + 1} do arquivo`;
    if (!p || !limpa(p.processo) || !Array.isArray(p.orgaos) || !Array.isArray(p.grupos) || !Array.isArray(p.itens)) throw new Error(`${rot}: dados incompletos.`);
    const reg = { recusadas: [], avisos: [], apuracao: [], resumo: { orgaos: {} }, historico: [], ...p, id: idDe(p.processo) };
    try { verificacoes(derivar(reg)); dotacaoGerada(derivar(reg)); } catch (e) { throw new Error(`${rot}: os dados não puderam ser abertos.`); }
    return reg;
  });
  return { arquivo, criadoEm: o.criadoEm, processos };
}
function blocoBackup(noProcesso) {
  return `<div class="saidas" style="margin-bottom:12px">
      ${noProcesso ? '<div class="cartao"><h2>Backup deste processo</h2><p>Arquivo com tudo deste processo: mapa, relatórios, dotações, lançamentos e histórico.</p><button class="btn prim" id="bkEste" type="button">Baixar backup (.json)</button></div>' : ""}
      <div class="cartao"><h2>Backup de todos os processos</h2><p>Um único arquivo com todos os processos guardados neste navegador.</p><button class="btn${noProcesso ? "" : " prim"}" id="bkTodos" type="button">Baixar todos (.json)</button></div>
      <div class="cartao"><h2>Importar e visualizar</h2><p>Abre um backup para você conferir. Nada é restaurado antes da sua confirmação.</p><label class="btn">Escolher backup (.json)<input class="visual-oculto" id="bkArquivo" type="file" accept=".json,application/json"></label></div>
    </div>
    <div class="caixa aviso"><p>O backup traz os dados do processo em texto aberto. Guarde em local seguro e não envie ao repositório.</p></div>
    <div id="previaBk"></div>`;
}
function ligarBackup() {
  const este = document.getElementById("bkEste");
  if (este) este.addEventListener("click", async () => {
    await salvarDotAgora();
    const p = await banco.ler(ATUAL.p.id);
    p.historico = [...(p.historico || []), { quando: agora(), acao: "Backup", detalhe: "Backup deste processo" }];
    await banco.gravar(p);
    exportarBackup([p], `backup_${nomeArq(p.processo)}_${dataArquivo()}.json`);
    toast("Backup gerado.");
    navegar(false);
  });
  document.getElementById("bkTodos").addEventListener("click", async () => {
    await salvarDotAgora();
    const lista = await banco.listar();
    if (!lista.length) { toast("Não há processos para o backup."); return; }
    exportarBackup(lista, `backup_mapa_todos_${dataArquivo()}.json`);
    toast(`Backup gerado com ${lista.length} ${lista.length === 1 ? "processo" : "processos"}.`);
  });
  document.getElementById("bkArquivo").addEventListener("change", async e => {
    const a = e.target.files[0];
    if (!a) return;
    const alvo = document.getElementById("previaBk");
    try {
      LIDO_BK = validarBackup(await a.text(), a.name);
      await desenharPreviaBk();
    } catch (err) {
      LIDO_BK = null;
      alvo.innerHTML = `<div class="caixa erro" role="alert"><p><b>Não foi possível abrir ${esc(a.name)}.</b> ${esc(err.message)} Nada foi alterado.</p></div>`;
    }
    e.target.value = "";
  });
}
function visualBackup(p) {
  const X = derivar(p), g = dotacaoGerada(X), v = verificacoes(X);
  const lancs = Object.values(p.dot.lanc || {}).reduce((a, l) => a + l.length, 0);
  return `<div class="kpis">
      <div class="kpi"><span>Valor total</span><b>${real(X.TOT.geral)}</b></div>
      ${X.orgaos.map(o => `<div class="kpi"><span>${esc(o)}</span><b>${real(X.TOT.org[o])}</b></div>`).join("")}
      <div class="kpi"><span>Grupos e itens</span><b>${X.G.length} e ${p.itens.length}</b></div>
      <div class="kpi"><span>Empresas</span><b>${X.EMP.length}</b></div>
      <div class="kpi"><span>Relatórios</span><b>${(p.relatorios || []).length}</b></div>
      <div class="kpi"><span>Lançamentos</span><b>${lancs}</b></div>
      <div class="kpi"><span>A DEFINIR</span><b>${real(g.totalADefinir)}</b></div>
      <div class="kpi"><span>Saldo não distribuído</span><b>${real(g.totalPendente)}</b></div>
      <div class="kpi"><span>Verificações sem pendência</span><b>${v.filter(x => x.ok).length} de ${v.length}</b></div>
    </div>
    <div class="rolagem"><table>
      <thead><tr><th class="centro">GP</th><th>Situação</th><th>Empresa</th><th class="num centro">Itens</th><th class="num">Valor</th></tr></thead>
      <tbody>${X.G.map(gr => `<tr><td class="centro">${esc(gr.grupo)}</td><td>${esc(ROTULO_SIT[gr.situacao] || gr.situacao)}</td><td>${esc(gr.empresa)}</td><td class="num centro">${gr.itens.length}</td><td class="num">${dinheiro(soma(gr.itens, i => i.total))}</td></tr>`).join("")}</tbody>
    </table></div>
    ${g.colunas.length ? `<h3 style="margin:12px 0 6px;font-size:14px">Dotações</h3><div class="rolagem"><table>
      <thead><tr><th>Órgão</th><th class="centro">Exercício</th><th>Dotação</th><th class="num">Valor</th></tr></thead>
      <tbody>${g.colunas.map((cl, j) => `<tr><td>${esc(cl.orgao)}</td><td class="centro">${esc(cl.exercicio)}</td><td class="mono">${cl.aDefinir ? 'A DEFINIR <span class="tag definir">Pendente de definição</span>' : esc(cl.codigo)}</td><td class="num">${dinheiro(soma(g.linhas, l => l.valores[j]))}</td></tr>`).join("")}</tbody>
    </table></div>` : ""}`;
}
async function desenharPreviaBk() {
  const b = LIDO_BK, alvo = document.getElementById("previaBk");
  const existentes = await Promise.all(b.processos.map(p => banco.ler(p.id)));
  const quando = b.criadoEm && !isNaN(new Date(b.criadoEm)) ? new Date(b.criadoEm).toLocaleString("pt-BR") : "data não informada";
  alvo.innerHTML = `<section class="cartao" aria-label="Visualização do backup">
    <div class="cab-grupo"><div class="emp"><h2>Backup: ${esc(semExtensao(b.arquivo))}</h2><small>Gerado em ${esc(quando)}. ${b.processos.length} ${b.processos.length === 1 ? "processo" : "processos"}.</small></div></div>
    <div class="corpo">
      ${b.processos.map((p, n) => `<details class="cartao"${b.processos.length === 1 ? " open" : ""}>
        <summary><input type="checkbox" data-bk="${n}" checked aria-label="Restaurar ${esc(p.processo)}"> <span class="mono">${esc(p.processo)}</span> ${esc(p.objeto)} ${existentes[n] ? '<span class="tag fra">Substitui o atual</span>' : '<span class="tag ok">Novo neste navegador</span>'}</summary>
        <div class="corpo">${existentes[n] ? `<div class="caixa aviso"><p>Este processo já existe neste navegador, importado em ${esc(existentes[n].importadoEm)}. Restaurar troca os dados atuais pelos do backup.</p></div>` : ""}${visualBackup(p)}</div>
      </details>`).join("")}
      <div class="botoes"><button class="btn prim" id="bkRestaurar" type="button">Restaurar selecionados</button><button class="btn" id="bkCancelar" type="button">Cancelar</button></div>
    </div></section>`;
  document.getElementById("bkCancelar").addEventListener("click", () => { LIDO_BK = null; alvo.innerHTML = ""; });
  alvo.querySelectorAll("summary input").forEach(i => i.addEventListener("click", e => e.stopPropagation()));
  const btn = document.getElementById("bkRestaurar");
  btn.addEventListener("click", async () => {
    const marcados = [...alvo.querySelectorAll("[data-bk]:checked")].map(x => Number(x.dataset.bk));
    if (!marcados.length) { toast("Selecione ao menos um processo."); return; }
    const troca = marcados.filter(n => existentes[n]).length;
    if (troca && btn.dataset.confirma !== "1") {
      btn.dataset.confirma = "1";
      btn.textContent = `Confirmar: substituir ${troca} ${troca === 1 ? "processo" : "processos"}`;
      btn.classList.add("perigo");
      return;
    }
    for (const n of marcados) {
      const p = b.processos[n];
      await banco.gravar({ ...p, historico: [...(p.historico || []), { quando: agora(), acao: "Backup restaurado", detalhe: semExtensao(b.arquivo) }] });
    }
    const unico = marcados.length === 1 ? b.processos[marcados[0]].id : null;
    LIDO_BK = null;
    toast(`${marcados.length} ${marcados.length === 1 ? "processo restaurado" : "processos restaurados"}.`);
    const destino = unico ? `#/p/${encodeURIComponent(unico)}/mapa` : "#/processos";
    if (location.hash === destino) navegar(true); else location.hash = destino;
  });
}
function telaBackup() {
  tela.innerHTML = `<h1>Backup</h1>
    <p class="sub">Guarde uma cópia do processo em um arquivo, para restaurar neste ou em outro navegador. Os dados deste app ficam só no navegador, e limpar o navegador apaga os processos.</p>
    <div style="height:14px"></div>
    ${blocoBackup(true)}`;
  ligarBackup();
}

/* ---------- Navegação, tema e impressão ---------- */
const TELAS = {
  importar: ["Importar", telaImportar], relatorio: ["Relatório do pregoeiro", telaRelatorio], mapa: ["Mapa por item", telaMapa], empresas: ["Apuração por empresa", telaEmpresas],
  dotacao: ["Dotação orçamentária", telaDotacao], conferencia: ["Conferência", telaConferencia], exportar: ["Exportar", telaExportar], backup: ["Backup", telaBackup]
};
function desenharPassos(rota) {
  const nav = document.getElementById("passos");
  const u = encodeURIComponent(ATUAL.p.id);
  const erros = verificacoes(ATUAL).filter(x => !x.ok).length;
  nav.hidden = false;
  nav.innerHTML = `<a class="voltar" href="#/processos">Processos</a>` + Object.keys(TELAS).map((k, i) =>
    `<a href="#/p/${u}/${k}"${k === rota ? ' aria-current="page"' : ""}><span class="n">${i + 1}</span>${TELAS[k][0]}${k === "conferencia" && erros ? ` <span class="tag erro">${erros}</span>` : ""}</a>`).join("");
}
function defineCabecalho(p) {
  document.getElementById("subtitulo").textContent = p ? [p.processo, p.pregao && "Pregão " + p.pregao, p.objeto].filter(Boolean).join(" · ") : "Importe uma planilha para montar o mapa";
  document.getElementById("fonte").textContent = p ? "Fonte: " + p.arquivo + ", importado em " + p.importadoEm + "." : "";
}
async function navegar(foco) {
  await salvarDotAgora();
  const m = location.hash.match(/^#\/p\/([^/]+)\/(\w+)/);
  PENDENTE = null;
  LIDO_BK = null;
  try {
    if (m) {
      const p = await banco.ler(decodeURIComponent(m[1]));
      if (p) {
        if (!ATUAL || ATUAL.p.id !== p.id) Object.keys(filtro).forEach(k => { filtro[k] = ""; });
        const rota = TELAS[m[2]] ? m[2] : "mapa";
        ATUAL = derivar(p);
        defineCabecalho(p);
        desenharPassos(rota);
        TELAS[rota][1]();
        document.title = TELAS[rota][0] + " · " + p.processo + " · Mapa de Distribuição";
      } else {
        ATUAL = null; defineCabecalho(null);
        document.getElementById("passos").hidden = true;
        tela.innerHTML = '<div class="vazio">Processo não encontrado neste navegador. <a href="#/processos">Voltar aos processos</a></div>';
      }
    } else {
      ATUAL = null; defineCabecalho(null);
      document.getElementById("passos").hidden = true;
      await telaProcessos();
      document.title = "Processos · Mapa de Distribuição";
    }
  } catch (err) {
    tela.innerHTML = `<div class="caixa erro" role="alert"><p><b>Não consegui abrir os dados guardados neste navegador.</b> ${esc(err.message)}</p></div>`;
  }
  if (foco) { tela.focus({ preventScroll: true }); window.scrollTo(0, 0); }
}
window.addEventListener("hashchange", () => navegar(true));
tela.addEventListener("click", e => {
  const b = e.target.closest(".desc");
  if (b) b.setAttribute("aria-expanded", b.getAttribute("aria-expanded") === "true" ? "false" : "true");
});
const btnTema = document.getElementById("btnTema");
function aplicarTema(t) {
  if (t === "dark") document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
  btnTema.textContent = t === "dark" ? "Tema claro" : "Tema escuro";
  btnTema.setAttribute("aria-pressed", String(t === "dark"));
}
const CHAVE = "mapa-planilha-tema";
try { aplicarTema(localStorage.getItem(CHAVE) === "dark" ? "dark" : "claro"); } catch (e) { aplicarTema("claro"); }
btnTema.addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "dark" ? "claro" : "dark";
  aplicarTema(t);
  try { localStorage.setItem(CHAVE, t); } catch (e) { /* sem armazenamento: vale só nesta sessão */ }
});
document.getElementById("btnImprimir").addEventListener("click", () => window.print());
navegar(false);
</script>
