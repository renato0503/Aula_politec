const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2));

function toast(msg, ms=3200){
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.style.display = "none"; }, ms);

function baixar(nome, conteudo, tipo="application/octet-stream"){
  const blob = conteudo instanceof Blob ? conteudo : new Blob([conteudo], {type: tipo});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function lerArquivoTexto(file){
  return new Promise((ok, erro)=>{ const r = new FileReader(); r.onload = ()=>ok(r.result); r.onerror = erro; r.readAsText(file); });
}
function dadosEmbutidos(id){

function lerArrayBuffer(file){

}
// sem acento, minúsculo, espaços simples: para casar nomes de colunas, setores e unidades
const normalizar = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
const hojeISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const dataCurtaBR = iso => iso ? iso.slice(0, 10).split("-").reverse().join("/") : "";
// "29/10/2026", "29/10/2026 09:15:00", "2026-10-29" -> "2026-10-29" (ou com hora: "2026-10-29T09:15:00")
function dataDeTexto(t){
  const s = String(t ?? "").trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if (m){ const d = `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`; return m[4] ? `${d}T${m[4].padStart(2, "0")}:${m[5]}:${m[6] || "00"}` : d; }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})(T[\d:]+)?/);
  return m ? m[0] : null;
}

/* ---------- dinheiro em centavos inteiros (sem erro de arredondamento) ---------- */
const dinheiro = {
  // "1.234,56" · "R$ 1.234,5" · "1234.56" · 12.5 -> centavos. Arredonda meio para cima na 3ª casa.
  de(v){
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "number") return Math.round(v * 100);
    let s = String(v).trim().replace(/^R\$\s*/, "").replace(/\s/g, "");
    const neg = s.startsWith("-"); s = s.replace(/^-/, "");
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
    const [i, d = ""] = s.split(".");
    if (!/^\d+$/.test(i) || !/^\d*$/.test(d)) return NaN;
    const c = Number(i) * 100 + Number((d + "00").slice(0, 2)) + (Number(d[2] || 0) >= 5 ? 1 : 0);
    return neg ? -c : c;
  },
  // 123456 -> "R$ 1.234,56"
  fmt(c){
    if (c === null || c === undefined || Number.isNaN(c)) return "";
    const neg = c < 0; c = Math.abs(c);
    return (neg ? "-" : "") + "R$ " + Math.floor(c / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "," + String(c % 100).padStart(2, "0");
  },
  // quantidade (até 3 casas) × valor unitário em centavos, arredondado a 2 casas
  vezes(qtd, c){ const q = Math.round(qtd * 1000); return Math.floor((q * c + 500) / 1000); },
  // divide um total em centavos pelos pesos, sem perder centavo (maiores restos)
  ratear(total, pesos){
    const soma = pesos.reduce((a, b)=>a + b, 0); if (!soma) return pesos.map(()=>0);
    const base = pesos.map(p=>Math.floor(total * p / soma)); const falta = total - base.reduce((a, b)=>a + b, 0);
    pesos.map((p, i)=>({i, r: total * p / soma - base[i]})).sort((a, b)=>b.r - a.r).slice(0, falta).forEach(x=>base[x.i]++);
    return base;
  }
};

/* ---------- documentos ---------- */
function cpfValido(v){
  const d = String(v || "").replace(/\D/g, "");
  if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
  for (const t of [9, 10]){
    let s = 0; for (let i = 0; i < t; i++) s += Number(d[i]) * (t + 1 - i);
    if (((s * 10) % 11) % 10 !== Number(d[t])) return false;
  }
  return true;
}
function cnpjValido(v){
  const d = String(v || "").replace(/\D/g, "");
  if (d.length !== 14 || /^(\d)\1{13}$/.test(d)) return false;
  const dv = n => { const pesos = n === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2];
    const s = pesos.reduce((a, p, i)=>a + Number(d[i]) * p, 0) % 11; return s < 2 ? 0 : 11 - s; };
  return dv(12) === Number(d[12]) && dv(13) === Number(d[13]);
}

/* ---------- CSV: separador detectado (; , ou tab), aspas, BOM ---------- */
function lerCSV(texto){
  texto = String(texto).replace(/^﻿/, "");
  const primeira = texto.split(/\r?\n/, 1)[0];
  const sep = [";", "\t", ","].map(c=>[c, primeira.split(c).length]).sort((a, b)=>b[1] - a[1])[0][0];
  const linhas = []; let linha = [], campo = "", aspas = false;
  for (let i = 0; i < texto.length; i++){
    const c = texto[i];
    if (aspas){
      if (c === '"' && texto[i + 1] === '"'){ campo += '"'; i++; }
      else if (c === '"') aspas = false; else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === sep){ linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r"){
      if (c === "\r" && texto[i + 1] === "\n") i++;
      linha.push(campo); campo = ""; if (linha.some(x=>x !== "")) linhas.push(linha); linha = [];
    } else campo += c;
  }
  linha.push(campo); if (linha.some(x=>x !== "")) linhas.push(linha);
  return linhas;
}
// sugere, para cada campo, a coluna do cabeçalho cujo nome contém um dos sinônimos
function sugerirColunas(cabecalho, sinonimos){
  const cab = cabecalho.map(normalizar), out = {};
  for (const [campo, lista] of Object.entries(sinonimos)){
    const i = cab.findIndex(c=>lista.some(s=>c === normalizar(s))) ;
    const j = i >= 0 ? i : cab.findIndex(c=>lista.some(s=>c.includes(normalizar(s))));
    out[campo] = j;
  }
  return out;
}

/* ---------- imagem: reduz no navegador antes de guardar ---------- */
function reduzirImagem(fonte, max=1280, qualidade=0.75){
  return new Promise((ok, erro)=>{
    const img = new Image();
    img.onload = ()=>{
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b=>{ URL.revokeObjectURL(img.src); b ? ok(b) : erro(new Error("Não consegui reduzir a imagem.")); }, "image/jpeg", qualidade);
    };
    img.onerror = ()=>erro(new Error("Arquivo de imagem ilegível."));
    img.src = fonte instanceof Blob ? URL.createObjectURL(fonte) : fonte;
  });
}

/* ---------- formulário ---------- */
// campo("nome", "Nome", {tipo: "text", valor, obrigatorio, ajuda, attrs})
function campo(id, rotulo, o={}){
  const tipo = o.tipo || "text", obr = o.obrigatorio ? " required" : "", v = o.valor ?? "";
  const ajuda = o.ajuda ? `<small class="sub" id="${id}-ajuda">${esc(o.ajuda)}</small>` : "";
  const desc = o.ajuda ? ` aria-describedby="${id}-ajuda"` : "";
  let ctl;
  if (tipo === "textarea") ctl = `<textarea id="${id}" name="${id}" rows="${o.linhas || 4}"${obr}${desc} ${o.attrs || ""}>${esc(v)}</textarea>`;
  else if (tipo === "select") ctl = `<select id="${id}" name="${id}"${obr}${desc} ${o.attrs || ""}>${(o.opcoes || []).map(op=>{
      const [val, txt] = Array.isArray(op) ? op : [op, op];
      return `<option value="${esc(val)}" ${String(val) === String(v) ? "selected" : ""}>${esc(txt)}</option>`; }).join("")}</select>`;
  else ctl = `<input id="${id}" name="${id}" type="${tipo}" value="${esc(v)}"${obr}${desc} ${o.attrs || ""}>`;
  return `<div class="campo"><label for="${id}">${esc(rotulo)}${o.obrigatorio ? " *" : ""}</label>${ctl}${ajuda}</div>`;
}
const valorDe = id => ($("#" + id)?.value ?? "").trim();
function mostrarErros(alvo, erros){
  const el = typeof alvo === "string" ? $(alvo) : alvo;
  el.innerHTML = erros.length ? `<div class="card pendente" role="alert"><b>Corrija antes de salvar:</b><ul>${erros.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>` : "";
  if (erros.length) el.scrollIntoView({block: "nearest"});
  return !erros.length;
}

/* ---------- db: camada fina sobre o IndexedDB ---------- */
const db = {
  con: null,
  abrir(){
    return new Promise((ok, erro)=>{
      const req = indexedDB.open(APP.db.nome, APP.db.versao);
      req.onupgradeneeded = ()=>{
        const banco = req.result;
        const stores = Object.assign({meta: {keyPath: "chave"}}, APP.db.stores);
        for (const [nome, def] of Object.entries(stores)){
          const st = banco.objectStoreNames.contains(nome) ? req.transaction.objectStore(nome) : banco.createObjectStore(nome, {keyPath: def.keyPath});
          for (const ix of def.indices || []){
            if (!st.indexNames.contains(ix.nome)) st.createIndex(ix.nome, ix.campo, {unique: !!ix.unico});
          }
        }
      };
      req.onsuccess = ()=>{ this.con = req.result; ok(this.con); };
      req.onerror = ()=>erro(req.error);
    });
  },
  _op(store, modo, fn){
    return new Promise((ok, erro)=>{
      const tx = this.con.transaction(store, modo); const r = fn(tx.objectStore(store));
      tx.oncomplete = ()=>ok(r && "result" in r ? r.result : undefined);
      tx.onerror = ()=>erro(tx.error); tx.onabort = ()=>erro(tx.error);
    });
  },
  get(store, chave){ return this._op(store, "readonly", s=>s.get(chave)); },
  list(store){ return this._op(store, "readonly", s=>s.getAll()); },
  porIndice(store, indice, valor){ return this._op(store, "readonly", s=>s.index(indice).getAll(valor)); },
  put(store, obj){ return this._op(store, "readwrite", s=>s.put(obj)); },
  del(store, chave){ return this._op(store, "readwrite", s=>s.delete(chave)); },
  limpar(store){ return this._op(store, "readwrite", s=>s.clear()); },
  async meta(chave, valor){
    if (valor === undefined){ const r = await this.get("meta", chave); return r ? r.valor : undefined; }
    return this.put("meta", {chave, valor});
  },
  async exportar(){
    const dados = {};
    for (const nome of Object.keys(APP.db.stores)) dados[nome] = await this.list(nome);
    return {app: APP.id, versao: APP.db.versao, exportado_em: agora(), dados};
  },
  async importar(pacote, substituir=true){
    if (!pacote || pacote.app !== APP.id) throw new Error("Este arquivo não é um backup deste app.");
    for (const [nome, linhas] of Object.entries(pacote.dados || {})){
      if (!APP.db.stores[nome]) continue;
      if (substituir) await this.limpar(nome);
      for (const l of linhas) await this.put(nome, l);
    }
  }
};
async function registrar(acao, detalhe={}){
  const store = APP.db.log || "log";
  if (!APP.db.stores[store]) return;
  await db.put(store, {id: uuid(), data_hora: agora(), perfil: estado.perfil || "", acao, ...detalhe});
}

/* ---------- tema ---------- */
function aplicarTema(t){ if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
function iniciarTema(){
  let t = null; try { t = localStorage.getItem(APP.id + ":tema"); } catch(e){}
  aplicarTema(t);
  $("#btnTema").addEventListener("click", ()=>{
    const escuro = document.documentElement.dataset.theme === "dark" ||
      (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    const novo = escuro ? "light" : "dark"; aplicarTema(novo);
    try { localStorage.setItem(APP.id + ":tema", novo); } catch(e){}
  });
}

/* ---------- roteador por hash ---------- */
const estado = {perfil: null, rota: null};
function casarRota(hash){
  const partes = hash.replace(/^#\/?/, "").split("?")[0].split("/").filter(Boolean);
  for (const r of APP.rotas){
    const molde = r.rota.replace(/^#\/?/, "").split("/").filter(Boolean);
    if (molde.length !== partes.length) continue;
    const params = {}; let ok = true;
    molde.forEach((m, i)=>{ if (m.startsWith(":")) params[m.slice(1)] = decodeURIComponent(partes[i]); else if (m !== partes[i]) ok = false; });
    if (ok) return {r, params};
  }
  return null;
}
function rotaPermitida(r){ return !r.perfis || !estado.perfil || r.perfis.includes(estado.perfil); }
function montarMenu(){
  $("#menu").innerHTML = APP.rotas.filter(r=>r.menu !== false && !r.publica && !r.rota.includes(":") && rotaPermitida(r))
    .map(r=>`<a href="${r.rota}" data-rota="${r.rota}">${esc(r.titulo)}</a>`).join("");
  const p = $("#perfilAtual");
  if (APP.perfis && estado.perfil){ p.hidden = false; p.textContent = "Perfil: " + estado.perfil; } else p.hidden = true;
}
async function navegar(){
  if (APP.perfis && !estado.perfil && !["#/testes", ...(APP.rotaSemPerfil || [])].some(x=>location.hash.startsWith(x))){
    if (APP.perfilDoServidor){
      $("#conteudo").innerHTML = `<div class="card pendente"><h1>Acesso restrito</h1><p>Esta área é só para servidores cadastrados. Entre com a conta institucional.</p></div>`;
      return;
    }
    return telaEscolherPerfil();
  }
  const hash = location.hash || APP.rotas[0].rota;
  const achou = hash.startsWith("#/testes") ? {r: {rota: "#/testes", titulo: "Testes", publica: false}, params: {}} : casarRota(hash);
  const alvo = $("#conteudo");
  $$("#menu a").forEach(a=>a.removeAttribute("aria-current"));
  if (!achou){ alvo.innerHTML = `<div class="card vazio">Tela não encontrada: <code>${esc(hash)}</code></div>`; return; }
  if (!rotaPermitida(achou.r)){ alvo.innerHTML = `<div class="card vazio">O perfil <b>${esc(estado.perfil)}</b> não usa esta tela.</div>`; return; }
  $("#menu").hidden = !!achou.r.publica;
  const link = $(`#menu a[data-rota="${achou.r.rota}"]`); if (link) link.setAttribute("aria-current", "page");
  estado.rota = achou.r.rota;
  document.title = achou.r.titulo + " · " + APP.titulo;
  const fn = TELAS[achou.r.rota] || telaPendente(achou.r);
  try { alvo.innerHTML = await fn(achou.params); if (TELAS_DEPOIS[achou.r.rota]) await TELAS_DEPOIS[achou.r.rota](achou.params); }
  catch(e){ console.error(e); alvo.innerHTML = `<div class="card pendente"><b>Erro nesta tela.</b><p class="mono">${esc(e.message)}</p></div>`; }
  alvo.focus({preventScroll: true});
}
function telaPendente(r){

    <div class="card pendente">Esta tela é construída no <b>Sprint ${esc(r.sprint)}</b> (ver <code>sprint.md</code>).</div>`;

const TESTES = [];
function teste(nome, fn){ TESTES.push({nome, fn}); }
async function telaTestes(){
  const res = [];
  for (const t of TESTES){

function inventariar(caminhos){
  const itens = ESPERADOS.map(e=>{
    const arquivos = caminhos.filter(e.casa);
    const status = !arquivos.length ? "ausente" : (arquivos.length > 1 && !e.varios ? "duplicado" : "presente");
    return {chave: e.chave, rotulo: e.rotulo, obrigatorio: e.obrigatorio, arquivos, status};
  });
  const sims = {};
  for (const c of caminhos){
    const partes = c.split("/"); if (partes.length < 2 || !/\.html?$/i.test(c)) continue;
    const m = partes[partes.length - 2].match(RE_OBJ); if (!m) continue;
    const obj = m[1].toUpperCase(); (sims[obj] = sims[obj] || []).push(c);
  }
  itens.push(...Object.keys(sims).sort().map(obj=>({chave: "sim:" + obj, rotulo: `Cartão SIM · objeto ${obj}`, obrigatorio: false,
    arquivos: sims[obj], status: sims[obj].length > 1 ? "duplicado" : "presente"})));
  return {itens, qtdSims: Object.keys(sims).length, faltando: itens.filter(i=>i.obrigatorio && i.status === "ausente").map(i=>i.chave)};
}

    const inv = inventariar(lista.map(x=>x.caminho));
    caso = {...caso, pasta_nome: nomePasta, inventario: inv, inventariado_em: agora(), informar_manual: [], inicio_em: caso.inicio_em || agora()};
    if (handle) caso.pasta_handle = handle;  // o handle volta numa próxima sessão, com nova permissão
    await db.put("casos", caso);
    await registrar("pasta inventariada", {id_caso: caso.id_caso, campo_verificado: "inventário", resultado: inv.faltando.length ? "faltando: " + inv.faltando.join(", ") : "completo"});
    navegar();
  };
  $("#btnPasta")?.addEventListener("click", async ()=>{
    try { const h = await window.showDirectoryPicker({mode: "read"}); await processar(await lerPastaPorHandle(h), h.name, h); }
    catch(e){ if (e.name !== "AbortError") toast("Não consegui abrir a pasta: " + e.message, 5000); }
  });
  $("#inpPasta").addEventListener("change", async e=>{
    const files = e.target.files; if (!files.length) return;
    await processar(lerPastaPorInput(files), files[0].webkitRelativePath.split("/")[0] || "pasta", null);
  });
  $$("[data-manual]").forEach(cb=>cb.addEventListener("change", async ()=>{
    const caso = await casoAtual();
    caso.informar_manual = $$("[data-manual]").filter(x=>x.checked).map(x=>x.dataset.manual);
    await db.put("casos", caso);
  }));
  $("#btnAvancar")?.addEventListener("click", async ()=>{
    const caso = await casoAtual(), pend = caso.inventario.faltando.filter(c=>!(caso.informar_manual || []).includes(c));
    if (pend.length){
      const nomes = pend.map(c=>ESPERADOS.find(e=>e.chave === c).rotulo);
      return mostrarErros("#avisoAvancar", [`Falta ${nomes.join(", ")}. Coloque o arquivo na pasta e selecione de novo, ou marque "informar manualmente" (RN02).`]);
    }
    await registrar("avançou para a extração", {id_caso: caso.id_caso, observacao: (caso.informar_manual || []).length ? "informar manualmente: " + caso.informar_manual.join(", ") : ""});
    location.hash = "#/dados";
  });
};

/* ================= Sprint 3 · Extratores TXT e HTML (RN03, RN06, RN07) ================= */
// Formato SUPOSTO dos arquivos: ver exemplos/FORMATOS.md. Ajustar as listas de rótulos quando chegarem as amostras reais.

// Texto do arquivo: BOM de UTF-8 ou UTF-16; sem BOM, UTF-8 estrito e, se falhar, Windows-1252.
function decodificar(buffer){
  const b = new Uint8Array(buffer);
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder("utf-16le").decode(b.subarray(2));
  if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder("utf-16be").decode(b.subarray(2));
  if (b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF) return new TextDecoder("utf-8").decode(b.subarray(3));
  // UTF-16 sem BOM: muitos zeros nas posições ímpares
  if (b.length > 8 && b.filter((x, i)=>i % 2 === 1 && x === 0).length > b.length / 4) return new TextDecoder("utf-16le").decode(b);
  try { return new TextDecoder("utf-8", {fatal: true}).decode(b); } catch(e){ return new TextDecoder("windows-1252").decode(b); }
}
// RN03: identificadores como texto, só dígitos; Luhn confere o último dígito
function luhnValido(s){
  const d = String(s || "").replace(/\D/g, ""); if (d.length < 2) return false;
  let soma = 0;
  for (let i = 0; i < d.length; i++){ let n = Number(d[d.length - 1 - i]); if (i % 2 === 1){ n *= 2; if (n > 9) n -= 9; } soma += n; }
  return soma % 10 === 0;
}
const imeiValido = s => /^\d{15}$/.test(s) && luhnValido(s);
const iccidValido = s => /^89\d{17,18}$/.test(s) && luhnValido(s);
const sha256Valido = s => /^[a-f0-9]{64}$/i.test(s);

// linhas "Rótulo: valor" -> [{rotulo, valor, linha}]
const linhasRotuladas = txt => txt.split(/\r?\n/).map((l, i)=>{ const m = l.match(/^\s*([^:]{1,40}):\s*(.*?)\s*$/); return m ? {rotulo: normalizar(m[1]), valor: m[2], linha: i + 1} : null; }).filter(Boolean);
const ROTULOS_APARELHO = {marca: ["manufacturer", "fabricante", "marca"], modelo: ["model", "modelo"], cor: ["color", "cor"],
                          imei_1: ["imei 1", "imei1", "imei"], imei_2: ["imei 2", "imei2"]};

// cada valor sai com a origem (arquivo e linha) e se é válido; ausente = null
function extrairAparelho(txt, arquivo="DEVICE INFO.txt"){
  const ls = linhasRotuladas(txt), out = {};
  for (const [campoA, rots] of Object.entries(ROTULOS_APARELHO)){
    const l = ls.find(x=>rots.includes(x.rotulo));
    if (!l || !l.valor){ out[campoA] = null; continue; }
    let valor = l.valor;
    if (campoA.startsWith("imei")) valor = valor.replace(/\D/g, "");  // texto só com dígitos, sem perder zero à esquerda
    out[campoA] = {valor, origem: arquivo, linha: l.linha, valido: campoA.startsWith("imei") ? imeiValido(valor) : true};
  }
  return out;
}
function extrairHash(txt, arquivo="HASHDOHASH.txt"){
  const ls = linhasRotuladas(txt);
  const lh = ls.find(x=>["hash", "sha-256", "sha256", "valor"].includes(x.rotulo));
  let valor = lh?.valor?.trim().toLowerCase(), linha = lh?.linha;
  if (!valor){ const i = txt.split(/\r?\n/).findIndex(x=>/\b[a-f0-9]{64}\b/i.test(x)); if (i >= 0){ valor = txt.split(/\r?\n/)[i].match(/\b[a-f0-9]{64}\b/i)[0].toLowerCase(); linha = i + 1; } }
  if (!valor) return null;
  const arq = ls.find(x=>["arquivo", "file", "nome do arquivo"].includes(x.rotulo)), alg = ls.find(x=>["algoritmo", "algorithm"].includes(x.rotulo));
  return {valor_hash: {valor, origem: arquivo, linha, valido: sha256Valido(valor)}, hash_arquivo: arq ? {valor: arq.valor, origem: arquivo, linha: arq.linha, valido: true} : null,
          algoritmo: alg ? alg.valor : "SHA-256"};
}
// RN07: o identificador do objeto vem do nome da pasta (OBJ 01-A)
function extrairSim(html, caminho){
  const pasta = caminho.split("/").slice(-2, -1)[0] || "", m = pasta.match(/obj\s*(\d{2}-[a-z])/i);
  const doc = new DOMParser().parseFromString(html, "text/html"), pares = {};
  doc.querySelectorAll("tr").forEach(tr=>{ const td = tr.querySelectorAll("td,th"); if (td.length >= 2) pares[normalizar(td[0].textContent)] = td[1].textContent.trim(); });
  const iccid = (pares["iccid"] || "").replace(/\D/g, "");
  return {identificador_objeto: m ? m[1].toUpperCase() : null, objeto_no_html: pares["objeto"] || null,
          iccid: iccid ? {valor: iccid, origem: caminho, valido: iccidValido(iccid)} : null,
          operadora: pares["operadora"] ? {valor: pares["operadora"], origem: caminho, valido: true} : null};
}

/* ---- testes dos extratores: valor certo, ausente e malformado ---- */
const TXT_OK = "Manufacturer: Samsung\r\nModel: SM-A325M\r\nColor: Preto\r\nIMEI 1: 351234567890126\r\nIMEI 2: 356938035643809\r\n";
teste("aparelho: marca, modelo e IMEIs com linha de origem", ()=>{ const a = extrairAparelho(TXT_OK); return a.marca.valor === "Samsung" && a.imei_1.linha === 4 && a.imei_2.valor === "356938035643809"; });
teste("aparelho: IMEI 2 ausente vira null, sem erro", ()=> extrairAparelho("Manufacturer: X\nIMEI 1: 351234567890126\n").imei_2 === null);
teste("aparelho: IMEI com dígito errado é marcado inválido", ()=> extrairAparelho("IMEI 1: 351234567890127\n").imei_1.valido === false);
teste("aparelho: IMEI com zero à esquerda continua texto", ()=> extrairAparelho("IMEI 1: 012345678901237\n").imei_1.valor === "012345678901237");
teste("hash: SHA-256 e arquivo", ()=>{ const h = extrairHash("Arquivo: OBJ01.zip\nAlgoritmo: SHA-256\nHash: " + "ab".repeat(32) + "\n"); return h.valor_hash.valido && h.hash_arquivo.valor === "OBJ01.zip"; });
teste("hash: arquivo sem hash devolve null", ()=> extrairHash("Arquivo: x.zip\n") === null);
teste("hash: 63 caracteres é inválido", ()=> extrairHash("Hash: " + "a".repeat(63) + "\n").valor_hash.valido === false);
teste("SIM: ICCID, operadora e objeto da pasta", ()=>{ const s = extrairSim('<table><tr><td>ICCID</td><td>8955100000000000009</td></tr><tr><td>Operadora</td><td>VIVO</td></tr></table>', "OBJ 01-A/SIM.html");
  return s.identificador_objeto === "01-A" && s.operadora.valor === "VIVO" && s.iccid.valor === "8955100000000000009"; });
teste("SIM: HTML sem ICCID devolve null no campo", ()=> extrairSim("<table><tr><td>Operadora</td><td>TIM</td></tr></table>", "OBJ 01-B/x.html").iccid === null);
teste("SIM: ICCID que não começa com 89 é inválido", ()=> extrairSim("<table><tr><td>ICCID</td><td>1234567890123456789</td></tr></table>", "OBJ 01-A/x.html").iccid.valido === false);
teste("texto UTF-16 com BOM", ()=>{ const s = "Model: Moto ç"; const b = new Uint8Array(2 + s.length * 2); b[0] = 0xFF; b[1] = 0xFE; for (let i = 0; i < s.length; i++){ b[2 + i * 2] = s.charCodeAt(i) & 255; b[3 + i * 2] = s.charCodeAt(i) >> 8; } return decodificar(b.buffer) === s; });
teste("texto Windows-1252", ()=> decodificar(new Uint8Array([77, 111, 100, 101, 108, 58, 32, 231]).buffer) === "Model: ç");

/* ---- extração do caso a partir da pasta lida no Sprint 2 ---- */
async function extrairCaso(caso){
  const ler = async c => decodificar(await lerArrayBuffer(arquivosDaSessao.get(c)));
  const inv = caso.inventario, achar = ch => inv.itens.find(i=>i.chave === ch)?.arquivos[0];
  const id = caso.id_caso, log = [];
  for (const s of ["aparelhos", "sims", "hashes"]) for (const r of await db.porIndice(s, "id_caso", id)) await db.del(s, r[s === "aparelhos" ? "id_aparelho" : s === "sims" ? "id_sim" : "id_hash"]);
  if (achar("device")){ const a = extrairAparelho(await ler(achar("device")), achar("device")); await db.put("aparelhos", {id_aparelho: id + "-A1", id_caso: id, ...a}); log.push("aparelho"); }
  if (achar("hash")){ const h = extrairHash(await ler(achar("hash")), achar("hash")); if (h) { await db.put("hashes", {id_hash: id + "-H1", id_caso: id, ...h}); log.push("hash"); } }
  for (const it of inv.itens.filter(i=>i.chave.startsWith("sim:"))){
    const s = extrairSim(await ler(it.arquivos[0]), it.arquivos[0]);
    await db.put("sims", {id_sim: `${id}-${s.identificador_objeto}`, id_caso: id, ...s}); log.push("sim " + s.identificador_objeto);
  }
  await db.put("casos", {...caso, extraido_em: agora()});
  await registrar("extração", {id_caso: id, campo_verificado: "extratores", resultado: log.join(", ") || "nada extraído"});
}

const celula = c => !c ? '<span class="selo alerta">ausente</span>'
  : `<span class="mono">${esc(c.valor)}</span> ${c.valido ? "" : '<span class="selo erro">inválido</span>'}<br><small class="sub">${esc(c.origem)}${c.linha ? `, linha ${c.linha}` : ""}</small>`;
TELAS["#/dados"] = async ()=>{
  let caso = await casoAtual();
  if (!caso?.inventario) return `<h1>Dados extraídos</h1><div class="card vazio">Selecione a pasta do caso em <a href="#/arquivos">Pasta do caso</a>.</div>`;
  if (!caso.extraido_em && arquivosDaSessao.size){ await extrairCaso(caso); caso = await casoAtual(); }
  const ap = (await db.porIndice("aparelhos", "id_caso", caso.id_caso))[0], hs = (await db.porIndice("hashes", "id_caso", caso.id_caso))[0];
  const sims = await db.porIndice("sims", "id_caso", caso.id_caso);
  return `<h1>Dados extraídos</h1><p class="sub">Caso ${esc(caso.numero_protocolo || "(sem protocolo)")} · extraído em ${dataBR(caso.extraido_em)}.
    A conferência campo a campo chega no Sprint 5. ${arquivosDaSessao.size ? `<button id="btnReextrair">Extrair de novo</button>` : ""}</p>
    <div class="card tabela-wrap"><h2 style="margin-top:0">Aparelho</h2>${ap ? `<table>${Object.keys(ROTULOS_APARELHO).map(k=>`<tr><th>${k.replace("_", " ")}</th><td>${celula(ap[k])}</td></tr>`).join("")}</table>` : '<p class="sub">DEVICE INFO.txt não lido.</p>'}</div>
    <div class="card tabela-wrap"><h2 style="margin-top:0">Hash</h2>${hs ? `<table><tr><th>valor</th><td>${celula(hs.valor_hash)}</td></tr><tr><th>arquivo</th><td>${celula(hs.hash_arquivo)}</td></tr></table>` : '<p class="sub">Sem HASHDOHASH.txt (informar manualmente na conferência).</p>'}</div>
    <div class="card tabela-wrap"><h2 style="margin-top:0">Cartões SIM (${sims.length})</h2>${sims.length ? `<table><tr><th>Objeto</th><th>ICCID</th><th>Operadora</th></tr>
      ${sims.map(s=>`<tr><td>${esc(s.identificador_objeto)}</td><td>${celula(s.iccid)}</td><td>${celula(s.operadora)}</td></tr>`).join("")}</table>` : '<p class="sub">Aparelho sem cartão SIM (RN06).</p>'}</div>`;
};
TELAS_DEPOIS["#/dados"] = ()=>{ $("#btnReextrair")?.addEventListener("click", async ()=>{ await extrairCaso(await casoAtual()); navegar(); }); };
