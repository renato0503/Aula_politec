[hidden]{display:none!important}

"use strict";

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2));
const agora = () => new Date().toISOString();
const dataBR = iso => iso ? new Date(iso).toLocaleString("pt-BR") : "";

function toast(msg, ms=3200){
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.style.display = "none"; }, ms);
}
function baixar(nome, conteudo, tipo="application/octet-stream"){
  const blob = conteudo instanceof Blob ? conteudo : new Blob([conteudo], {type: tipo});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function lerArquivoTexto(file){
  return new Promise((ok, erro)=>{ const r = new FileReader(); r.onload = ()=>ok(r.result); r.onerror = erro; r.readAsText(file); });
}
function dadosEmbutidos(id){
  const el = document.getElementById(id);
  return el && el.textContent.trim() ? JSON.parse(el.textContent) : null;
}
function lerArrayBuffer(file){
  return new Promise((ok, erro)=>{ const r = new FileReader(); r.onload = ()=>ok(r.result); r.onerror = erro; r.readAsArrayBuffer(file); });
}
// sem acento, minúsculo, espaços simples: para casar nomes de colunas, setores e unidades
const normalizar = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
const hojeISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const dataCurtaBR = iso => iso ? iso.slice(0, 10).split("-").reverse().join("/") : "";
// "29/10/2026", "29/10/2026 09:15:00", "2026-10-29" -> "2026-10-29" (ou com hora: "2026-10-29T09:15:00")
function dataDeTexto(t){
  const s = String(t ?? "").trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if (m){ const d = `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`; return m[4] ? `${d}T${m[4].padStart(2, "0")}:${m[5]}:${m[6] || "00"}` : d; }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})(T[\d:]+)?/);
  return m ? m[0] : null;
}

/* ---------- dinheiro em centavos inteiros (sem erro de arredondamento) ---------- */
const dinheiro = {
  // "1.234,56" · "R$ 1.234,5" · "1234.56" · 12.5 -> centavos. Arredonda meio para cima na 3ª casa.
  de(v){
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "number") return Math.round(v * 100);
    let s = String(v).trim().replace(/^R\$\s*/, "").replace(/\s/g, "");
    const neg = s.startsWith("-"); s = s.replace(/^-/, "");
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
    const [i, d = ""] = s.split(".");
    if (!/^\d+$/.test(i) || !/^\d*$/.test(d)) return NaN;
    const c = Number(i) * 100 + Number((d + "00").slice(0, 2)) + (Number(d[2] || 0) >= 5 ? 1 : 0);
    return neg ? -c : c;
  },
  // 123456 -> "R$ 1.234,56"
  fmt(c){
    if (c === null || c === undefined || Number.isNaN(c)) return "";
    const neg = c < 0; c = Math.abs(c);
    return (neg ? "-" : "") + "R$ " + Math.floor(c / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "," + String(c % 100).padStart(2, "0");
  },
  // quantidade (até 3 casas) × valor unitário em centavos, arredondado a 2 casas
  vezes(qtd, c){ const q = Math.round(qtd * 1000); return Math.floor((q * c + 500) / 1000); },
  // divide um total em centavos pelos pesos, sem perder centavo (maiores restos)
  ratear(total, pesos){
    const soma = pesos.reduce((a, b)=>a + b, 0); if (!soma) return pesos.map(()=>0);
    const base = pesos.map(p=>Math.floor(total * p / soma)); const falta = total - base.reduce((a, b)=>a + b, 0);
    pesos.map((p, i)=>({i, r: total * p / soma - base[i]})).sort((a, b)=>b.r - a.r).slice(0, falta).forEach(x=>base[x.i]++);
    return base;
  }
};

/* ---------- documentos ---------- */
function cpfValido(v){
  const d = String(v || "").replace(/\D/g, "");
  if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
  for (const t of [9, 10]){
    let s = 0; for (let i = 0; i < t; i++) s += Number(d[i]) * (t + 1 - i);
    if (((s * 10) % 11) % 10 !== Number(d[t])) return false;
  }
  return true;
}
function cnpjValido(v){
  const d = String(v || "").replace(/\D/g, "");
  if (d.length !== 14 || /^(\d)\1{13}$/.test(d)) return false;
  const dv = n => { const pesos = n === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2];
    const s = pesos.reduce((a, p, i)=>a + Number(d[i]) * p, 0) % 11; return s < 2 ? 0 : 11 - s; };
  return dv(12) === Number(d[12]) && dv(13) === Number(d[13]);
}

/* ---------- CSV: separador detectado (; , ou tab), aspas, BOM ---------- */
function lerCSV(texto){
  texto = String(texto).replace(/^﻿/, "");
  const primeira = texto.split(/\r?\n/, 1)[0];
  const sep = [";", "\t", ","].map(c=>[c, primeira.split(c).length]).sort((a, b)=>b[1] - a[1])[0][0];
  const linhas = []; let linha = [], campo = "", aspas = false;
  for (let i = 0; i < texto.length; i++){
    const c = texto[i];
    if (aspas){
      if (c === '"' && texto[i + 1] === '"'){ campo += '"'; i++; }
      else if (c === '"') aspas = false; else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === sep){ linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r"){
      if (c === "\r" && texto[i + 1] === "\n") i++;
      linha.push(campo); campo = ""; if (linha.some(x=>x !== "")) linhas.push(linha); linha = [];
    } else campo += c;
  }
  linha.push(campo); if (linha.some(x=>x !== "")) linhas.push(linha);
  return linhas;
}
// sugere, para cada campo, a coluna do cabeçalho cujo nome contém um dos sinônimos
function sugerirColunas(cabecalho, sinonimos){
  const cab = cabecalho.map(normalizar), out = {};
  for (const [campo, lista] of Object.entries(sinonimos)){
    const i = cab.findIndex(c=>lista.some(s=>c === normalizar(s))) ;
    const j = i >= 0 ? i : cab.findIndex(c=>lista.some(s=>c.includes(normalizar(s))));
    out[campo] = j;
  }
  return out;
}

/* ---------- imagem: reduz no navegador antes de guardar ---------- */
function reduzirImagem(fonte, max=1280, qualidade=0.75){
  return new Promise((ok, erro)=>{
    const img = new Image();
    img.onload = ()=>{
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b=>{ URL.revokeObjectURL(img.src); b ? ok(b) : erro(new Error("Não consegui reduzir a imagem.")); }, "image/jpeg", qualidade);
    };
    img.onerror = ()=>erro(new Error("Arquivo de imagem ilegível."));
    img.src = fonte instanceof Blob ? URL.createObjectURL(fonte) : fonte;
  });
}

  else if (tipo === "select") ctl = `<select id="${id}" name="${id}"${obr}${desc} ${o.attrs || ""}>${(o.opcoes || []).map(op=>{

/* ---------- db: camada fina sobre o IndexedDB ---------- */
const db = {
  con: null,
  abrir(){
    return new Promise((ok, erro)=>{
      const req = indexedDB.open(APP.db.nome, APP.db.versao);
      req.onupgradeneeded = ()=>{
        const banco = req.result;
        const stores = Object.assign({meta: {keyPath: "chave"}}, APP.db.stores);
        for (const [nome, def] of Object.entries(stores)){
          const st = banco.objectStoreNames.contains(nome) ? req.transaction.objectStore(nome) : banco.createObjectStore(nome, {keyPath: def.keyPath});
          for (const ix of def.indices || []){
            if (!st.indexNames.contains(ix.nome)) st.createIndex(ix.nome, ix.campo, {unique: !!ix.unico});
          }
        }
      };
      req.onsuccess = ()=>{ this.con = req.result; ok(this.con); };
      req.onerror = ()=>erro(req.error);
    });
  },
  _op(store, modo, fn){
    return new Promise((ok, erro)=>{
      const tx = this.con.transaction(store, modo); const r = fn(tx.objectStore(store));
      tx.oncomplete = ()=>ok(r && "result" in r ? r.result : undefined);
      tx.onerror = ()=>erro(tx.error); tx.onabort = ()=>erro(tx.error);
    });
  },
  get(store, chave){ return this._op(store, "readonly", s=>s.get(chave)); },
  list(store){ return this._op(store, "readonly", s=>s.getAll()); },
  porIndice(store, indice, valor){ return this._op(store, "readonly", s=>s.index(indice).getAll(valor)); },
  put(store, obj){ return this._op(store, "readwrite", s=>s.put(obj)); },
  del(store, chave){ return this._op(store, "readwrite", s=>s.delete(chave)); },
  limpar(store){ return this._op(store, "readwrite", s=>s.clear()); },
  async meta(chave, valor){
    if (valor === undefined){ const r = await this.get("meta", chave); return r ? r.valor : undefined; }
    return this.put("meta", {chave, valor});
  },
  async exportar(){
    const dados = {};
    for (const nome of Object.keys(APP.db.stores)) dados[nome] = await this.list(nome);
    return {app: APP.id, versao: APP.db.versao, exportado_em: agora(), dados};
  },
  async importar(pacote, substituir=true){
    if (!pacote || pacote.app !== APP.id) throw new Error("Este arquivo não é um backup deste app.");
    for (const [nome, linhas] of Object.entries(pacote.dados || {})){
      if (!APP.db.stores[nome]) continue;
      if (substituir) await this.limpar(nome);
      for (const l of linhas) await this.put(nome, l);
    }
  }
};
async function registrar(acao, detalhe={}){
  const store = APP.db.log || "log";
  if (!APP.db.stores[store]) return;
  await db.put(store, {id: uuid(), data_hora: agora(), perfil: estado.perfil || "", acao, ...detalhe});

function casarRota(hash){
  const partes = hash.replace(/^#\/?/, "").split("?")[0].split("/").filter(Boolean);
  for (const r of APP.rotas){
    const molde = r.rota.replace(/^#\/?/, "").split("/").filter(Boolean);
    if (molde.length !== partes.length) continue;
    const params = {}; let ok = true;
    molde.forEach((m, i)=>{ if (m.startsWith(":")) params[m.slice(1)] = decodeURIComponent(partes[i]); else if (m !== partes[i]) ok = false; });
    if (ok) return {r, params};
  }
  return null;
}
function rotaPermitida(r){ return !r.perfis || !estado.perfil || r.perfis.includes(estado.perfil); }

  $("#menu").innerHTML = APP.rotas.filter(r=>r.menu !== false && !r.publica && !r.rota.includes(":") && rotaPermitida(r))

  const p = $("#perfilAtual");
  if (APP.perfis && estado.perfil){ p.hidden = false; p.textContent = "Perfil: " + estado.perfil; } else p.hidden = true;

  const alvo = $("#conteudo");

    g.fillStyle = "#1c2430"; g.font = "bold 36px sans-serif"; g.textAlign = "center";
    g.fillText("FOTO DE TESTE", cv.width / 2, cv.height / 2 - 20);
    g.font = "24px sans-serif"; g.fillText(tipo === "rosto" ? "rosto (fictício)" : "documento (fictício)", cv.width / 2, cv.height / 2 + 24);
    cv.toBlob(ok, "image/jpeg", 0.8);
  });
}
// RN03: só segue a distância com a CIN válida e sem mudança de dados
const elegivel = (valida, mudou)=> valida === "sim" && mudou === "nao";
teste("RN03: CIN vencida não é elegível", ()=> !elegivel("nao", "nao") && !elegivel("sim", "sim") && elegivel("sim", "nao"));
function validarPedido(p, fotos){
  const e = [];
  if (p.nome.split(/\s+/).length < 2) e.push("Informe o nome completo.");
  if (!cpfValido(p.cpf)) e.push("CPF inválido (RN01).");
  if (!p.nascimento || p.nascimento > hojeISO()) e.push("Informe a data de nascimento.");
  if (!p.validade_cin) e.push("Informe a validade da CIN.");
  else if (p.validade_cin < hojeISO()) e.push("A CIN está vencida: o pedido é feito no posto (RN03).");
  if (!/^\S+@\S+\.\S+$/.test(p.contato) && p.contato.replace(/\D/g, "").length < 10) e.push("Informe um e-mail ou um telefone com DDD para contato.");
  if (!fotos.rosto) e.push("Falta a foto do rosto (RN02).");
  if (!fotos.documento) e.push("Falta a foto do documento (RN02).");
  return e;
}
const novoProtocolo = ()=> "2V-" + hojeISO().replace(/-/g, "") + "-" + Math.random().toString(16).slice(2, 6).toUpperCase();

TELAS["#/pedido"] = async ()=> `<h1>Pedir a segunda via da Carteira de Identidade</h1>
  <p class="sub">Sem ir ao posto, quando a primeira via ainda está válida e nenhum dado mudou.</p>
  <form class="card" id="formElegivel"><h2 style="margin-top:0">1. Antes de começar</h2>
    <fieldset style="border:0;padding:0"><legend>Sua Carteira de Identidade (primeira via) está dentro da validade?</legend>
      <label style="display:inline-flex;gap:6px;margin-right:16px"><input type="radio" name="valida" value="sim" style="width:auto"> Sim</label>
      <label style="display:inline-flex;gap:6px"><input type="radio" name="valida" value="nao" style="width:auto"> Não</label></fieldset>
    <fieldset style="border:0;padding:0;margin-top:10px"><legend>Algum dado mudou desde a emissão (nome, estado civil, filiação)?</legend>
      <label style="display:inline-flex;gap:6px;margin-right:16px"><input type="radio" name="mudou" value="sim" style="width:auto"> Sim</label>
      <label style="display:inline-flex;gap:6px"><input type="radio" name="mudou" value="nao" style="width:auto"> Não</label></fieldset>
    <div class="linha-botoes"><button class="prim" type="submit">Continuar</button></div></form>
  <div id="naoElegivel"></div><div id="etapaDados"></div>`;

function formDados(){
  return `<form class="card" id="formPedido"><h2 style="margin-top:0">2. Seus dados</h2><div class="campos">
      ${campo("cNome", "Nome completo", {obrigatorio: true, attrs: 'autocomplete="name"'})}
      ${campo("cCpf", "CPF (é o número da CIN)", {obrigatorio: true, attrs: 'inputmode="numeric" autocomplete="off" placeholder="000.000.000-00"'})}
      ${campo("cNasc", "Data de nascimento", {tipo: "date", obrigatorio: true})}
      ${campo("cValidade", "Validade da CIN", {tipo: "date", obrigatorio: true})}
      ${campo("cContato", "E-mail ou telefone para contato", {obrigatorio: true})}</div>
    <h2>3. Fotos</h2><p class="sub">Protótipo: use as fotos de teste. Não envie fotos reais.</p>
    <div class="grade">${["rosto", "documento"].map(t=>`<div class="card"><b>${t === "rosto" ? "Foto do rosto" : "Foto do documento"}</b>
      <div id="prev-${t}" style="margin:8px 0;min-height:60px" class="sub">Sem foto.</div>
      <label class="botao">Tirar ou escolher foto<input type="file" accept="image/*" capture="${t === "rosto" ? "user" : "environment"}" data-foto="${t}" hidden></label>
      <button type="button" data-teste="${t}">Usar foto de teste</button></div>`).join("")}</div>
    <div id="errosPedido"></div>
    <div class="linha-botoes"><button class="prim" type="submit">Enviar pedido</button></div></form>`;
}
async function definirFoto(tipo, blob){
  fotosDoPedido[tipo] = await reduzirImagem(blob, 800, 0.8);
  $(`#prev-${tipo}`).innerHTML = `<img src="${URL.createObjectURL(fotosDoPedido[tipo])}" alt="Foto do ${tipo}" style="max-width:120px;border-radius:6px">
    <br><small>${(fotosDoPedido[tipo].size / 1024).toFixed(0)} KB</small>`;
}
TELAS_DEPOIS["#/pedido"] = ()=>{
  fotosDoPedido.rosto = fotosDoPedido.documento = null;
  $("#formElegivel").addEventListener("submit", e=>{
    e.preventDefault();
    const valida = $("input[name=valida]:checked")?.value, mudou = $("input[name=mudou]:checked")?.value;
    if (!valida || !mudou) return toast("Responda às duas perguntas.");
    if (!elegivel(valida, mudou)){
      $("#etapaDados").innerHTML = "";
      $("#naoElegivel").innerHTML = `<div class="card pendente" id="avisoPosto"><h2 style="margin-top:0">Este pedido é feito no posto</h2>
        <p>${valida === "nao" ? "Com a CIN vencida" : "Com mudança de dados"}, a segunda via precisa de nova coleta no posto de identificação.</p>
        <a class="botao prim" href="${LINK_AGENDAMENTO}">Agendar atendimento no posto</a></div>`;
      return;
    }
    $("#naoElegivel").innerHTML = ""; $("#etapaDados").innerHTML = formDados(); ligarPedido();
  });
};
function ligarPedido(){
  $$("[data-foto]").forEach(inp=>inp.addEventListener("change", async e=>{
    const f = e.target.files[0]; if (!f) return;
    try { await definirFoto(e.target.dataset.foto, f); } catch(err){ toast(err.message); }
  }));
  $$("[data-teste]").forEach(b=>b.addEventListener("click", async ()=>definirFoto(b.dataset.teste, await fotoDeTeste(b.dataset.teste))));
  $("#formPedido").addEventListener("submit", async e=>{
    e.preventDefault();
    const p = {nome: valorDe("cNome"), cpf: valorDe("cCpf").replace(/\D/g, ""), nascimento: valorDe("cNasc"), validade_cin: valorDe("cValidade"), contato: valorDe("cContato")};
    if (!mostrarErros("#errosPedido", validarPedido(p, fotosDoPedido))) return;
    const protocolo = novoProtocolo();
    await db.put("pedidos", {protocolo, ...p, numero_cin: p.cpf, mudou_dados: false, criado_em: agora(), situacao: "recebido", motivo: ""});
    for (const t of ["rosto", "documento"]) await db.put("fotos", {id: `${protocolo}-${t}`, protocolo, tipo: t, conteudo: fotosDoPedido[t]});
    await registrar("pedido enviado", {protocolo});
    $("#etapaDados").innerHTML = `<div class="card" id="protocoloGerado"><h2 style="margin-top:0">Pedido recebido</h2>
      <p>Protocolo: <b class="mono" id="numProtocolo">${protocolo}</b></p><p>Guarde o número. O servidor confere o pedido e a situação aparece no protocolo.</p>
      <a class="botao" href="#/protocolo/${encodeURIComponent(protocolo)}">Acompanhar o pedido</a></div>`;
    $("#formElegivel").remove();
  });
}

/* ================= Sprint 3 · Fila do servidor (RN05) ================= */
const MOTIVOS_RECUSA = ["Foto ilegível", "CIN vencida", "Mudança de dados", "Dados divergentes do cadastro", "Outro"];
const SITUACOES = ["recebido", "aceito", "recusado"];
const fmtCpf = c => String(c || "").replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, "$1.$2.$3-$4");
// elegibilidade conferida de novo pelo servidor (RN03)
const eleg = p => ({validade: !!p.validade_cin && p.validade_cin >= hojeISO(), dados: !p.mudou_dados, cpf: cpfValido(p.cpf)});

function filtroFila(){ return estado.filtroFila || (estado.filtroFila = {situacao: "recebido"}); }
TELAS["#/fila"] = async ()=>{
  const f = filtroFila(), todos = await db.list("pedidos");
  const lista = todos.filter(p=>!f.situacao || p.situacao === f.situacao).sort((a, b)=>a.criado_em.localeCompare(b.criado_em));
  const sel = estado.pedidoSel && await db.get("pedidos", estado.pedidoSel);
  let ficha = "";
  if (sel){
    const fotos = await db.porIndice("fotos", "protocolo", sel.protocolo), e = eleg(sel);
    const decs = (await db.porIndice("decisoes", "protocolo", sel.protocolo)).sort((a, b)=>b.data.localeCompare(a.data));
    ficha = `<div class="card" id="fichaPedido"><h2 style="margin-top:0">Pedido ${esc(sel.protocolo)} <span class="selo info" id="sitPedido">${esc(sel.situacao)}</span></h2>
      <p><b>${esc(sel.nome)}</b> · CPF ${esc(fmtCpf(sel.cpf))} · nascimento ${dataCurtaBR(sel.nascimento)} · contato ${esc(sel.contato)}</p>
      <p>Elegibilidade: <span class="selo ${e.validade ? "ok" : "erro"}">CIN ${e.validade ? "válida até " + dataCurtaBR(sel.validade_cin) : "vencida"}</span>
        <span class="selo ${e.dados ? "ok" : "erro"}">${e.dados ? "sem mudança de dados" : "dados mudaram"}</span>
        <span class="selo ${e.cpf ? "ok" : "erro"}">CPF ${e.cpf ? "válido" : "inválido"}</span></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${fotos.map(ft=>`<figure style="margin:0"><img src="${URL.createObjectURL(ft.conteudo)}" alt="Foto: ${esc(ft.tipo)}" style="max-width:200px;border-radius:8px"><figcaption class="sub">${esc(ft.tipo)}</figcaption></figure>`).join("")
        || '<p class="sub">Sem fotos (pedido do exemplo).</p>'}</div>
      ${sel.situacao === "recebido" ? `<div class="campos">${campo("fMotivo", "Motivo da recusa", {tipo: "select", opcoes: [["", "Escolha"], ...MOTIVOS_RECUSA]})}${campo("fObs", "Observação")}</div>
        <div id="errosFila"></div><div class="linha-botoes"><button class="prim" id="btnAceitar">Aceitar</button><button class="perigo" id="btnRecusar">Recusar</button>
        <a class="botao" href="#/pedido/${encodeURIComponent(sel.protocolo)}/resumo">Resumo para o sistema</a></div>`
      : `<p>${sel.motivo ? `Motivo: <b>${esc(sel.motivo)}</b>` : ""}</p><a class="botao" href="#/pedido/${encodeURIComponent(sel.protocolo)}/resumo">Resumo para o sistema</a>`}
      ${decs.length ? `<p class="sub">Decisões: ${decs.map(d=>`${dataBR(d.data)} · ${esc(d.resultado)}${d.motivo ? " (" + esc(d.motivo) + ")" : ""} · ${esc(d.servidor)}`).join("<br>")}</p>` : ""}</div>`;
  }
  return `<h1>Fila de pedidos</h1><div class="linha-botoes" style="margin-top:0">${["", ...SITUACOES].map(s=>`<button data-sit="${s}" ${s === f.situacao ? 'class="prim"' : ""}>
    ${s || "todos"} (<span data-qtd="${s || "todos"}">${s ? todos.filter(p=>p.situacao === s).length : todos.length}</span>)</button>`).join("")}</div>
    ${ficha}
    <div class="card tabela-wrap"><table><tr><th>Protocolo</th><th>Pedido em</th><th>Nome</th><th>Elegível</th><th>Situação</th></tr>
      ${lista.map(p=>{ const e = eleg(p), ok = e.validade && e.dados && e.cpf; return `<tr><td><a href="#" data-sel="${esc(p.protocolo)}">${esc(p.protocolo)}</a></td>
        <td>${dataBR(p.criado_em)}</td><td>${esc(p.nome)}</td><td>${ok ? '<span class="selo ok">sim</span>' : '<span class="selo erro">não</span>'}</td><td>${esc(p.situacao)}</td></tr>`; }).join("")
        || '<tr><td colspan="5" class="vazio">Nenhum pedido nesta situação.</td></tr>'}</table></div>`;
};
TELAS_DEPOIS["#/fila"] = ()=>{
  $$("[data-sit]").forEach(b=>b.addEventListener("click", ()=>{ filtroFila().situacao = b.dataset.sit; navegar(); }));
  $$("[data-sel]").forEach(a=>a.addEventListener("click", e=>{ e.preventDefault(); estado.pedidoSel = a.dataset.sel; navegar(); }));
  const decidir = resultado => async ()=>{
    const p = await db.get("pedidos", estado.pedidoSel), motivo = valorDe("fMotivo"), obs = valorDe("fObs");
    if (resultado === "recusado" && !motivo) return mostrarErros("#errosFila", ["A recusa precisa de motivo (RN05)."]);
    if (resultado === "recusado" && motivo === "Outro" && !obs) return mostrarErros("#errosFila", ["Descreva o motivo na observação."]);
    const servidor = (await db.meta("servidor_nome")) || estado.perfil;
    const texto = resultado === "recusado" ? (motivo === "Outro" ? obs : motivo + (obs ? ": " + obs : "")) : "";
    await db.put("decisoes", {id: uuid(), protocolo: p.protocolo, resultado, motivo: texto, servidor, data: agora()});
    await db.put("pedidos", {...p, situacao: resultado, motivo: texto, decidido_em: agora()});
    await registrar("pedido " + resultado, {protocolo: p.protocolo, detalhe: texto});
    toast(`Pedido ${resultado}.`); navegar();
  };
  $("#btnAceitar")?.addEventListener("click", decidir("aceito")); $("#btnRecusar")?.addEventListener("click", decidir("recusado"));
};

TELAS["#/pedido/:id/resumo"] = async ({id})=>{
  const p = await db.get("pedidos", id);
  if (!p) return `<div class="card vazio">Pedido não encontrado.</div>`;
  const linhas = [["Protocolo", p.protocolo], ["Nome", p.nome], ["CPF", fmtCpf(p.cpf)], ["Data de nascimento", dataCurtaBR(p.nascimento)],
    ["Número da CIN", fmtCpf(p.numero_cin)], ["Validade da CIN", dataCurtaBR(p.validade_cin)], ["Contato", p.contato], ["Pedido em", dataBR(p.criado_em)],
    ["Situação", p.situacao + (p.motivo ? " · " + p.motivo : "")], ["Serviço", "Segunda via da CIN, sem nova coleta (dados sem mudança)"]];
  const texto = linhas.map(([k, v])=>`${k}: ${v}`).join("\n");
  return `<h1>Resumo para o sistema de identificação civil</h1><p class="sub">Confira e lance no sistema. O envio automático não faz parte do MVP.</p>
    <div class="card tabela-wrap"><table id="tabelaResumo">${linhas.map(([k, v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</table>
    <textarea id="textoResumo" hidden>${esc(texto)}</textarea>
    <div class="linha-botoes nao-imprimir"><button class="prim" id="btnCopiarResumo">Copiar</button><button onclick="window.print()">Imprimir</button><a class="botao" href="#/fila">Voltar à fila</a></div></div>`;
};
TELAS_DEPOIS["#/pedido/:id/resumo"] = ()=>{
  $("#btnCopiarResumo")?.addEventListener("click", async ()=>{ try { await navigator.clipboard.writeText($("#textoResumo").value); toast("Resumo copiado."); } catch(e){ toast("Não consegui copiar."); } });
};

/* ================= Sprint 4 · Protocolo do cidadão ================= */
const SIT_PROTOCOLO = {recebido: "Recebido, aguardando conferência", aceito: "Aceito", recusado: "Recusado"};

TELAS["#/protocolo/:id"] = async ({id})=>{
  const p = await db.get("pedidos", id);
  if (!p) return `<div class="card vazio">Protocolo <span class="mono">${esc(id)}</span> não encontrado. <a href="#/pedido">Fazer um pedido</a></div>`;
  const decs = (await db.porIndice("decisoes", "protocolo", id)).sort((a, b)=>b.data.localeCompare(a.data));
  const selo = p.situacao === "aceito" ? "ok" : p.situacao === "recusado" ? "erro" : "info";
  return `<h1>Protocolo <span class="mono" id="numProtocolo">${esc(p.protocolo)}</span></h1>
    <p class="sub">Pedido de segunda via da CIN · enviado em ${dataBR(p.criado_em)}</p>
    <div class="card"><p>Situação: <span class="selo ${selo}" id="sitProtocolo">${esc(SIT_PROTOCOLO[p.situacao] || p.situacao)}</span></p>
      ${p.motivo ? `<p><b>Motivo:</b> <span id="motivoProtocolo">${esc(p.motivo)}</span></p>` : ""}
      <p class="sub">${p.situacao === "recebido" ? "O servidor confere o pedido e a situação muda aqui." : p.situacao === "aceito" ? "O pedido foi aceito e segue para o resumo do sistema." : "O pedido precisa ser feito de novo, corrigindo o motivo acima."}</p>
      <div class="linha-botoes nao-imprimir">
        ${p.situacao === "aceito" ? `<a class="botao prim" href="#/pedido/${encodeURIComponent(p.protocolo)}/resumo">Ver o resumo</a>` : ""}
        <a class="botao" href="#/pedido">Novo pedido</a>
        <button onclick="window.print()">Imprimir</button></div></div>
    <div class="card tabela-wrap"><h2 style="margin-top:0">Dados do pedido</h2><table>
      <tr><th>Nome</th><td>${esc(p.nome)}</td></tr><tr><th>CPF</th><td class="mono">${esc(fmtCpf(p.cpf))}</td></tr>
      <tr><th>Nascimento</th><td>${dataCurtaBR(p.nascimento)}</td></tr><tr><th>Validade da CIN</th><td>${dataCurtaBR(p.validade_cin)}</td></tr>
      <tr><th>Contato</th><td>${esc(p.contato)}</td></tr></table></div>
    ${decs.length ? `<div class="card tabela-wrap"><h2 style="margin-top:0">Decisões</h2><table><tr><th>Data</th><th>Resultado</th><th>Motivo</th><th>Servidor</th></tr>
      ${decs.map(d=>`<tr><td>${dataBR(d.data)}</td><td>${esc(d.resultado)}</td><td>${esc(d.motivo || "—")}</td><td>${esc(d.servidor)}</td></tr>`).join("")}</table></div>` : ""}`;
};


iniciar();
</script>
</body>
</html>
