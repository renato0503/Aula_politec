<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; connect-src 'none'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; worker-src blob:">
<title>Gestão de Documentos</title>
<meta name="description" content="Cadastro, atribuição e acompanhamento dos processos, com o prazo calculado e o sinal verde, amarelo ou vermelho. Dados fictícios.">
<style>
/* ===================================================================
   BASE COMUM DOS APPS (Apps/_base/base.html)
   Tema, layout, componentes. O CSS do app fica no fim deste bloco.
   =================================================================== */
:root{
  --bg:#f6f7f9; --painel:#ffffff; --ink:#1c2430; --ink2:#5b6676; --linha:#dde2e9;
  --accent:#1f5fae; --accent-ink:#ffffff; --verde:#1d7a46; --ambar:#a86500; --vermelho:#b42318;
  --sombra:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.10);
  --raio:10px; --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161d; --painel:#1a212b; --ink:#e6eaf0; --ink2:#a3adbb; --linha:#2c3542;
    --accent:#6ea8ff; --accent-ink:#0b1220; --verde:#4cc283; --ambar:#f0b44c; --vermelho:#ff7b72;
    --sombra:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161d; --painel:#1a212b; --ink:#e6eaf0; --ink2:#a3adbb; --linha:#2c3542;
  --accent:#6ea8ff; --accent-ink:#0b1220; --verde:#4cc283; --ambar:#f0b44c; --vermelho:#ff7b72;
  --sombra:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.topo{background:var(--painel);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:5}
.topo-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.marca{font-weight:700;font-size:17px;margin-right:auto}
.marca small{display:block;font-weight:400;font-size:12px;color:var(--ink2)}
.aviso-topo{background:var(--accent);color:var(--accent-ink);font-size:13px;text-align:center;padding:4px 16px}
nav.menu{max-width:1200px;margin:0 auto;padding:0 16px 8px;display:flex;gap:4px;flex-wrap:wrap}
nav.menu a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--ink2);font-size:14px}
nav.menu a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px} h2{font-size:18px;margin:24px 0 8px}
.sub{color:var(--ink2);margin:0 0 16px}
.card{background:var(--painel);border:1px solid var(--linha);border-radius:var(--raio);padding:16px;box-shadow:var(--sombra);margin-bottom:16px}
.grade{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.kpi .v{font-size:26px;font-weight:700} .kpi .r{color:var(--ink2);font-size:13px}
button,.botao{font:inherit;border:1px solid var(--linha);background:var(--painel);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
button.prim,.botao.prim{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.perigo{border-color:var(--vermelho);color:var(--vermelho)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--linha);border-radius:8px;padding:7px 9px;width:100%}
label{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px}
.linha-botoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabela-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--linha);vertical-align:top}
th{color:var(--ink2);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.selo{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}
.selo.ok{color:var(--verde)} .selo.alerta{color:var(--ambar)} .selo.erro{color:var(--vermelho)} .selo.info{color:var(--accent)}
.vazio{color:var(--ink2);text-align:center;padding:28px}
.campos{display:grid;gap:0 16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.campo small{display:block;margin-top:2px}
.ok-txt{color:var(--verde)} .erro-txt{color:var(--vermelho)} .alerta-txt{color:var(--ambar)}
.pendente{border-left:4px solid var(--ambar)}
code,.mono{font-family:var(--mono);font-size:13px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:20;max-width:90vw}
@media (max-width:640px){ .marca{font-size:15px} main{padding:16px 16px 48px} }
@media print{ .topo,nav.menu,#toast,.nao-imprimir{display:none!important} body{background:#fff;color:#000} .card{box-shadow:none;break-inside:avoid} }
/* ===== CSS DO APP ===== */

</style>
</head>

<header class="topo">
  <div class="aviso-topo">Protótipo com dados fictícios. Não cadastre processos, requerentes ou documentos reais.</div>
  <div class="topo-in">
    <div class="marca">Gestão de Documentos<small>POLITEC/MT · processos e prazos do Gabinete de Direção</small></div>
    <span id="perfilAtual" class="selo info" hidden></span>

  </div>
  <nav class="menu" id="menu" aria-label="Telas do app"></nav>
</header>
<main id="conteudo" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>

function dataDeTexto(t){
  const s = String(t ?? "").trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if (m){ const d = `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`; return m[4] ? `${d}T${m[4].padStart(2, "0")}:${m[5]}:${m[6] || "00"}` : d; }
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})(T[\d:]+)?/);
  return m ? m[0] : null;
}

/* ---------- dinheiro em centavos inteiros (sem erro de arredondamento) ---------- */
const dinheiro = {
  // "1.234,56" · "R$ 1.234,5" · "1234.56" · 12.5 -> centavos. Arredonda meio para cima na 3ª casa.
  de(v){
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "number") return Math.round(v * 100);
    let s = String(v).trim().replace(/^R\$\s*/, "").replace(/\s/g, "");
    const neg = s.startsWith("-"); s = s.replace(/^-/, "");
    if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
    const [i, d = ""] = s.split(".");
    if (!/^\d+$/.test(i) || !/^\d*$/.test(d)) return NaN;
    const c = Number(i) * 100 + Number((d + "00").slice(0, 2)) + (Number(d[2] || 0) >= 5 ? 1 : 0);
    return neg ? -c : c;
  },
  // 123456 -> "R$ 1.234,56"
  fmt(c){
    if (c === null || c === undefined || Number.isNaN(c)) return "";
    const neg = c < 0; c = Math.abs(c);
    return (neg ? "-" : "") + "R$ " + Math.floor(c / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "," + String(c % 100).padStart(2, "0");
  },
  // quantidade (até 3 casas) × valor unitário em centavos, arredondado a 2 casas
  vezes(qtd, c){ const q = Math.round(qtd * 1000); return Math.floor((q * c + 500) / 1000); },
  // divide um total em centavos pelos pesos, sem perder centavo (maiores restos)
  ratear(total, pesos){
    const soma = pesos.reduce((a, b)=>a + b, 0); if (!soma) return pesos.map(()=>0);
    const base = pesos.map(p=>Math.floor(total * p / soma)); const falta = total - base.reduce((a, b)=>a + b, 0);
    pesos.map((p, i)=>({i, r: total * p / soma - base[i]})).sort((a, b)=>b.r - a.r).slice(0, falta).forEach(x=>base[x.i]++);
    return base;
  }
};

/* ---------- documentos ---------- */
function cpfValido(v){
  const d = String(v || "").replace(/\D/g, "");
  if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
  for (const t of [9, 10]){
    let s = 0; for (let i = 0; i < t; i++) s += Number(d[i]) * (t + 1 - i);
    if (((s * 10) % 11) % 10 !== Number(d[t])) return false;
  }
  return true;
}
function cnpjValido(v){
  const d = String(v || "").replace(/\D/g, "");
  if (d.length !== 14 || /^(\d)\1{13}$/.test(d)) return false;
  const dv = n => { const pesos = n === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2];
    const s = pesos.reduce((a, p, i)=>a + Number(d[i]) * p, 0) % 11; return s < 2 ? 0 : 11 - s; };
  return dv(12) === Number(d[12]) && dv(13) === Number(d[13]);
}

/* ---------- CSV: separador detectado (; , ou tab), aspas, BOM ---------- */
function lerCSV(texto){
  texto = String(texto).replace(/^﻿/, "");
  const primeira = texto.split(/\r?\n/, 1)[0];
  const sep = [";", "\t", ","].map(c=>[c, primeira.split(c).length]).sort((a, b)=>b[1] - a[1])[0][0];
  const linhas = []; let linha = [], campo = "", aspas = false;
  for (let i = 0; i < texto.length; i++){
    const c = texto[i];
    if (aspas){
      if (c === '"' && texto[i + 1] === '"'){ campo += '"'; i++; }
      else if (c === '"') aspas = false; else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === sep){ linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r"){
      if (c === "\r" && texto[i + 1] === "\n") i++;
      linha.push(campo); campo = ""; if (linha.some(x=>x !== "")) linhas.push(linha); linha = [];
    } else campo += c;
  }
  linha.push(campo); if (linha.some(x=>x !== "")) linhas.push(linha);
  return linhas;
}
// sugere, para cada campo, a coluna do cabeçalho cujo nome contém um dos sinônimos
function sugerirColunas(cabecalho, sinonimos){
  const cab = cabecalho.map(normalizar), out = {};
  for (const [campo, lista] of Object.entries(sinonimos)){
    const i = cab.findIndex(c=>lista.some(s=>c === normalizar(s))) ;
    const j = i >= 0 ? i : cab.findIndex(c=>lista.some(s=>c.includes(normalizar(s))));
    out[campo] = j;
  }
  return out;
}

/* ---------- imagem: reduz no navegador antes de guardar ---------- */
function reduzirImagem(fonte, max=1280, qualidade=0.75){
  return new Promise((ok, erro)=>{
    const img = new Image();
    img.onload = ()=>{
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b=>{ URL.revokeObjectURL(img.src); b ? ok(b) : erro(new Error("Não consegui reduzir a imagem.")); }, "image/jpeg", qualidade);
    };
    img.onerror = ()=>erro(new Error("Arquivo de imagem ilegível."));
    img.src = fonte instanceof Blob ? URL.createObjectURL(fonte) : fonte;
  });
}

/* ---------- formulário ---------- */
// campo("nome", "Nome", {tipo: "text", valor, obrigatorio, ajuda, attrs})
function campo(id, rotulo, o={}){
  const tipo = o.tipo || "text", obr = o.obrigatorio ? " required" : "", v = o.valor ?? "";
  const ajuda = o.ajuda ? `<small class="sub" id="${id}-ajuda">${esc(o.ajuda)}</small>` : "";
  const desc = o.ajuda ? ` aria-describedby="${id}-ajuda"` : "";
  let ctl;
  if (tipo === "textarea") ctl = `<textarea id="${id}" name="${id}" rows="${o.linhas || 4}"${obr}${desc} ${o.attrs || ""}>${esc(v)}</textarea>`;
  else if (tipo === "select") ctl = `<select id="${id}" name="${id}"${obr}${desc} ${o.attrs || ""}>${(o.opcoes || []).map(op=>{
      const [val, txt] = Array.isArray(op) ? op : [op, op];
      return `<option value="${esc(val)}" ${String(val) === String(v) ? "selected" : ""}>${esc(txt)}</option>`; }).join("")}</select>`;
  else ctl = `<input id="${id}" name="${id}" type="${tipo}" value="${esc(v)}"${obr}${desc} ${o.attrs || ""}>`;
  return `<div class="campo"><label for="${id}">${esc(rotulo)}${o.obrigatorio ? " *" : ""}</label>${ctl}${ajuda}</div>`;
}
const valorDe = id => ($("#" + id)?.value ?? "").trim();
function mostrarErros(alvo, erros){
  const el = typeof alvo === "string" ? $(alvo) : alvo;
  el.innerHTML = erros.length ? `<div class="card pendente" role="alert"><b>Corrija antes de salvar:</b><ul>${erros.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>` : "";
  if (erros.length) el.scrollIntoView({block: "nearest"});
  return !erros.length;
}

/* ---------- db: camada fina sobre o IndexedDB ---------- */
const db = {
  con: null,
  abrir(){
    return new Promise((ok, erro)=>{
      const req = indexedDB.open(APP.db.nome, APP.db.versao);
      req.onupgradeneeded = ()=>{
        const banco = req.result;
        const stores = Object.assign({meta: {keyPath: "chave"}}, APP.db.stores);
        for (const [nome, def] of Object.entries(stores)){
          const st = banco.objectStoreNames.contains(nome) ? req.transaction.objectStore(nome) : banco.createObjectStore(nome, {keyPath: def.keyPath});
          for (const ix of def.indices || []){
            if (!st.indexNames.contains(ix.nome)) st.createIndex(ix.nome, ix.campo, {unique: !!ix.unico});
          }
        }
      };
      req.onsuccess = ()=>{ this.con = req.result; ok(this.con); };
      req.onerror = ()=>erro(req.error);
    });
  },
  _op(store, modo, fn){
    return new Promise((ok, erro)=>{
      const tx = this.con.transaction(store, modo); const r = fn(tx.objectStore(store));
      tx.oncomplete = ()=>ok(r && "result" in r ? r.result : undefined);
      tx.onerror = ()=>erro(tx.error); tx.onabort = ()=>erro(tx.error);
    });
  },
  get(store, chave){ return this._op(store, "readonly", s=>s.get(chave)); },
  list(store){ return this._op(store, "readonly", s=>s.getAll()); },
  porIndice(store, indice, valor){ return this._op(store, "readonly", s=>s.index(indice).getAll(valor)); },
  put(store, obj){ return this._op(store, "readwrite", s=>s.put(obj)); },
  del(store, chave){ return this._op(store, "readwrite", s=>s.delete(chave)); },
  limpar(store){ return this._op(store, "readwrite", s=>s.clear()); },
  async meta(chave, valor){
    if (valor === undefined){ const r = await this.get("meta", chave); return r ? r.valor : undefined; }
    return this.put("meta", {chave, valor});
  },
  async exportar(){
    const dados = {};
    for (const nome of Object.keys(APP.db.stores)) dados[nome] = await this.list(nome);
    return {app: APP.id, versao: APP.db.versao, exportado_em: agora(), dados};
  },
  async importar(pacote, substituir=true){
    if (!pacote || pacote.app !== APP.id) throw new Error("Este arquivo não é um backup deste app.");
    for (const [nome, linhas] of Object.entries(pacote.dados || {})){
      if (!APP.db.stores[nome]) continue;
      if (substituir) await this.limpar(nome);
      for (const l of linhas) await this.put(nome, l);
    }
  }
};
async function registrar(acao, detalhe={}){
  const store = APP.db.log || "log";
  if (!APP.db.stores[store]) return;
  await db.put(store, {id: uuid(), data_hora: agora(), perfil: estado.perfil || "", acao, ...detalhe});
}

/* ---------- tema ---------- */
function aplicarTema(t){ if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
function iniciarTema(){
  let t = null; try { t = localStorage.getItem(APP.id + ":tema"); } catch(e){}
  aplicarTema(t);
  $("#btnTema").addEventListener("click", ()=>{
    const escuro = document.documentElement.dataset.theme === "dark" ||
      (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    const novo = escuro ? "light" : "dark"; aplicarTema(novo);
    try { localStorage.setItem(APP.id + ":tema", novo); } catch(e){}
  });
}

/* ---------- roteador por hash ---------- */
const estado = {perfil: null, rota: null};
function casarRota(hash){
  const partes = hash.replace(/^#\/?/, "").split("?")[0].split("/").filter(Boolean);
  for (const r of APP.rotas){
    const molde = r.rota.replace(/^#\/?/, "").split("/").filter(Boolean);
    if (molde.length !== partes.length) continue;
    const params = {}; let ok = true;
    molde.forEach((m, i)=>{ if (m.startsWith(":")) params[m.slice(1)] = decodeURIComponent(partes[i]); else if (m !== partes[i]) ok = false; });
    if (ok) return {r, params};
  }
  return null;
}
function rotaPermitida(r){ return !r.perfis || !estado.perfil || r.perfis.includes(estado.perfil); }
function montarMenu(){
  $("#menu").innerHTML = APP.rotas.filter(r=>r.menu !== false && !r.publica && !r.rota.includes(":") && rotaPermitida(r))
    .map(r=>`<a href="${r.rota}" data-rota="${r.rota}">${esc(r.titulo)}</a>`).join("");
  const p = $("#perfilAtual");
  if (APP.perfis && estado.perfil){ p.hidden = false; p.textContent = "Perfil: " + estado.perfil; } else p.hidden = true;
}
async function navegar(){
  if (APP.perfis && !estado.perfil && !["#/testes", ...(APP.rotaSemPerfil || [])].some(x=>location.hash.startsWith(x))){
    if (APP.perfilDoServidor){
      $("#conteudo").innerHTML = `<div class="card pendente"><h1>Acesso restrito</h1><p>Esta área é só para servidores cadastrados. Entre com a conta institucional.</p></div>`;
      return;
    }
    return telaEscolherPerfil();
  }
  const hash = location.hash || APP.rotas[0].rota;
  const achou = hash.startsWith("#/testes") ? {r: {rota: "#/testes", titulo: "Testes", publica: false}, params: {}} : casarRota(hash);
  const alvo = $("#conteudo");
  $$("#menu a").forEach(a=>a.removeAttribute("aria-current"));
  if (!achou){ alvo.innerHTML = `<div class="card vazio">Tela não encontrada: <code>${esc(hash)}</code></div>`; return; }
  if (!rotaPermitida(achou.r)){ alvo.innerHTML = `<div class="card vazio">O perfil <b>${esc(estado.perfil)}</b> não usa esta tela.</div>`; return; }
  $("#menu").hidden = !!achou.r.publica;
  const link = $(`#menu a[data-rota="${achou.r.rota}"]`); if (link) link.setAttribute("aria-current", "page");
  estado.rota = achou.r.rota;
  document.title = achou.r.titulo + " · " + APP.titulo;
  const fn = TELAS[achou.r.rota] || telaPendente(achou.r);
  try { alvo.innerHTML = await fn(achou.params); if (TELAS_DEPOIS[achou.r.rota]) await TELAS_DEPOIS[achou.r.rota](achou.params); }
  catch(e){ console.error(e); alvo.innerHTML = `<div class="card pendente"><b>Erro nesta tela.</b><p class="mono">${esc(e.message)}</p></div>`; }
  alvo.focus({preventScroll: true});
}
function telaPendente(r){
  return async ()=>`<h1>${esc(r.titulo)}</h1><p class="sub">${esc(r.descricao || "")}</p>
    <div class="card pendente">Esta tela é construída no <b>Sprint ${esc(r.sprint)}</b> (ver <code>sprint.md</code>).</div>`;
}

/* ---------- perfis (o perfil escolhe as telas; não é controle de segurança) ---------- */
function telaEscolherPerfil(){
  $("#menu").hidden = true;
  $("#conteudo").innerHTML = `<h1>Escolha o perfil desta cópia</h1>
    <p class="sub">O perfil define quais telas aparecem neste computador. Ele pode ser trocado em Configuração.</p>
    <div class="grade">${APP.perfis.map(p=>`<button class="card" data-perfil="${esc(p.id)}" style="text-align:left"><b>${esc(p.nome)}</b><br><span class="sub">${esc(p.descricao)}</span></button>`).join("")}</div>`;
  $$("[data-perfil]").forEach(b=>b.addEventListener("click", async ()=>{
    estado.perfil = b.dataset.perfil; await db.meta("perfil", estado.perfil); await registrar("perfil escolhido", {detalhe: estado.perfil});
    montarMenu(); location.hash = APP.rotas.find(rotaPermitida).rota; navegar();
  }));
}

/* ---------- configuração comum: backup, dados fictícios, perfil, limpeza ---------- */
async function blocoConfigComum(){
  const usado = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null;
  const persist = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false;
  return `<div class="card"><h2 style="margin-top:0">Backup</h2>
      <p class="sub">Os dados ficam só neste navegador. Exporte o backup toda semana.</p>
      <div class="linha-botoes"><button class="prim" id="btnExportar">Exportar backup (.json)</button>
      <label class="botao" style="margin:0">Importar backup<input type="file" id="arqBackup" accept=".json" hidden></label></div>
      <p class="sub" style="margin-top:10px">Armazenamento: ${usado ? (usado.usage/1048576).toFixed(1) + " MB usados" : "não informado"} ·
      ${persist ? '<span class="selo ok">persistente</span>' : '<span class="selo alerta">pode ser apagado pelo navegador</span>'}</p></div>
    ${dadosEmbutidos("seed") ? `<div class="card"><h2 style="margin-top:0">Dados fictícios</h2>
      <p class="sub">Carrega o conjunto de exemplo para testar. Substitui os dados atuais.</p>
      <button id="btnSeed">Carregar dados fictícios</button></div>` : ""}
    ${APP.perfis ? `<div class="card"><h2 style="margin-top:0">Perfil desta cópia</h2>
      <p class="sub">Atual: <b>${esc(estado.perfil || "nenhum")}</b></p><button id="btnTrocarPerfil">Trocar perfil</button></div>` : ""}
    <div class="card"><h2 style="margin-top:0">Apagar tudo</h2>
      <p class="sub">Remove todos os dados deste app neste navegador.</p><button class="perigo" id="btnApagar">Apagar todos os dados</button></div>`;
}
function ligarConfigComum(){
  $("#btnExportar")?.addEventListener("click", async ()=>{
    baixar(`${APP.id}-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(await db.exportar(), null, 2), "application/json");
    await registrar("backup exportado");
  });
  $("#arqBackup")?.addEventListener("change", async e=>{
    const f = e.target.files[0]; if (!f) return;
    try { await db.importar(JSON.parse(await lerArquivoTexto(f))); await registrar("backup importado", {detalhe: f.name}); toast("Backup importado."); navegar(); }
    catch(err){ toast("Não consegui importar: " + err.message, 5000); }
  });
  $("#btnSeed")?.addEventListener("click", async ()=>{
    if (!confirm("Substituir os dados atuais pelos dados fictícios?")) return;
    await db.importar({app: APP.id, dados: dadosEmbutidos("seed")}); await registrar("dados fictícios carregados");
    toast("Dados fictícios carregados."); navegar();
  });
  $("#btnTrocarPerfil")?.addEventListener("click", async ()=>{ estado.perfil = null; await db.meta("perfil", null); montarMenu(); telaEscolherPerfil(); });
  $("#btnApagar")?.addEventListener("click", async ()=>{
    if (!confirm("Apagar todos os dados deste app neste navegador?")) return;
    for (const nome of Object.keys(APP.db.stores)) await db.limpar(nome);
    toast("Dados apagados."); navegar();
  });
}

/* ---------- testes embutidos (#/testes) ---------- */
const TESTES = [];
function teste(nome, fn){ TESTES.push({nome, fn}); }
async function telaTestes(){
  const res = [];
  for (const t of TESTES){
    try { const r = await t.fn(); res.push({nome: t.nome, ok: r !== false, msg: r === true || r === undefined ? "" : String(r)}); }
    catch(e){ res.push({nome: t.nome, ok: false, msg: e.message}); }
  }
  window.__testes = res;
  const ok = res.filter(r=>r.ok).length;
  return `<h1>Testes</h1><p class="sub" id="resumoTestes">${ok} de ${res.length} passaram</p>
    <div class="card tabela-wrap"><table><tr><th>Teste</th><th>Resultado</th></tr>${res.map(r=>`<tr><td>${esc(r.nome)}</td>
    <td>${r.ok ? '<span class="selo ok">ok</span>' : '<span class="selo erro">falhou</span> <span class="mono">' + esc(r.msg) + "</span>"}</td></tr>`).join("")}</table></div>`;
}

/* ---------- partida ---------- */
const TELAS = {"#/testes": telaTestes}, TELAS_DEPOIS = {};
async function iniciar(){
  iniciarTema();
  await db.abrir();
  if (navigator.storage && navigator.storage.persist) { try { await navigator.storage.persist(); } catch(e){} }
  if (APP.perfis) estado.perfil = (await db.meta("perfil")) || null;
  if (typeof iniciarApp === "function") await iniciarApp();
  montarMenu();
  window.addEventListener("hashchange", navegar);
  await navegar();
}

/* Gestão de Documentos · código do app (Sprints 1 e 2) */
"use strict";
const GD_ANEXOS = ["Requerimento", "Documento de identificação", "Anexos obrigatórios"];
const GD_PRAZO = 15;
const gdDias = (a, b = hojeISO())=> Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
const gdSomar = (iso, n)=>{ const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
// RN02: número único de autuação no formato YYYY.NNNN-SD
const gdNumero = (ano, seq)=> `${ano}.${String(seq).padStart(4, "0")}-SD`;
teste("RN02: número no formato YYYY.NNNN-SD", ()=> gdNumero(2026, 7) === "2026.0007-SD");

// RN06/RN07: percentual decorrido e o sinal visual
function gdPrazo(p, hoje = hojeISO()){
  const dias = Number(p.dias_prazo || GD_PRAZO), decorridos = gdDias(p.data_autuacao, hoje);
  const pct = dias ? Math.round(decorridos / dias * 100) : 0;
  const sinal = p.status === "concluido" ? "concluido" : pct >= 100 ? "vermelho" : pct >= 70 ? "amarelo" : "verde";
  return {dias, decorridos, pct, sinal, limite: gdSomar(p.data_autuacao, dias)};
}
teste("RN06/RN07: 60% verde, 80% amarelo, 110% vermelho", ()=>{
  const base = {data_autuacao: "2026-10-01", dias_prazo: 10, status: "em andamento"};
  return gdPrazo(base, "2026-10-07").sinal === "verde" && gdPrazo(base, "2026-10-09").sinal === "amarelo" && gdPrazo(base, "2026-10-12").sinal === "vermelho";
});
teste("Concluído não entra no sinal", ()=> gdPrazo({data_autuacao: "2026-01-01", dias_prazo: 10, status: "concluido"}).sinal === "concluido");
teste("Exemplo com 12 processos", ()=> dadosEmbutidos("seed").processos.length === 12);

const GD_SINAL = {verde: "No prazo", amarelo: "Atenção (70% do prazo)", vermelho: "Vencido", concluido: "Concluído"};
const gdSelo = s => s === "vermelho" ? "erro" : s === "amarelo" ? "alerta" : s === "concluido" ? "info" : "ok";

async function gdUsuarios(){ return Object.fromEntries((await db.list("usuarios")).map(u=>[u.id_usuario, u])); }

TELAS["#/painel"] = async ()=>{
  const ps = (await db.list("processos")).filter(p=>p.status !== "arquivado"), us = await gdUsuarios();
  const hoje = hojeISO(), infos = ps.map(p=>({p, ...gdPrazo(p, hoje)}));
  const por = s => infos.filter(x=>x.sinal === s);
  return `<h1>Painel do Gabinete</h1><p class="sub">${ps.length} processos em acompanhamento. <a href="#/processo/novo">Cadastrar processo</a></p>
    <div class="grade"><div class="card kpi"><div class="v" data-vencidos>${por("vermelho").length}</div><div class="r">vencidos</div></div>
      <div class="card kpi"><div class="v" data-amarelos>${por("amarelo").length}</div><div class="r">em atenção (70% do prazo)</div></div>
      <div class="card kpi"><div class="v">${por("verde").length}</div><div class="r">no prazo</div></div>
      <div class="card kpi"><div class="v">${por("concluido").length}</div><div class="r">concluídos</div></div></div>
    <div class="card tabela-wrap"><h2 style="margin-top:0">Mesa virtual</h2><table><tr><th>Processo</th><th>Assunto</th><th>Responsável</th><th>Limite</th><th class="num">Decorrido</th><th>Sinal</th></tr>
      ${infos.sort((a, b)=>b.pct - a.pct).map(x=>`<tr><td><a href="#/processo/${encodeURIComponent(x.p.id_processo)}">${esc(x.p.numero_processo)}</a></td>
        <td>${esc(x.p.assunto)}</td><td>${esc(us[x.p.responsavel]?.nome || x.p.responsavel || "—")}</td><td>${dataCurtaBR(x.limite)}</td>
        <td class="num">${x.pct}%</td><td><span class="selo ${gdSelo(x.sinal)}">${esc(GD_SINAL[x.sinal])}</span></td></tr>`).join("")}</table></div>`;
};

function gdFiltros(){ return estado.gdFiltros || (estado.gdFiltros = {sinal: "", status: "", busca: ""}); }
TELAS["#/processos"] = async ()=>{
  const f = gdFiltros(), ps = await db.list("processos"), us = await gdUsuarios(), hoje = hojeISO(), b = normalizar(f.busca);
  const lista = ps.map(p=>({p, ...gdPrazo(p, hoje), resp: us[p.responsavel]?.nome || p.responsavel || ""}))
    .filter(x=>(!f.sinal || x.sinal === f.sinal) && (!f.status || x.p.status === f.status)
      && (!b || normalizar(`${x.p.numero_processo} ${x.p.assunto} ${x.p.requerente} ${x.resp}`).includes(b)))
    .sort((a, b2)=>b2.pct - a.pct);
  return `<h1>Processos <span class="sub">(${lista.length})</span></h1><p class="sub"><a href="#/processo/novo">Cadastrar processo</a></p>
    <div class="card"><div class="campos">
      ${campo("gdBusca", "Busca por número, assunto ou requerente", {valor: f.busca})}
      ${campo("gdSinal", "Sinal do prazo", {tipo: "select", opcoes: [["", "Todos"], ...Object.entries(GD_SINAL)], valor: f.sinal})}
      ${campo("gdStatus", "Situação", {tipo: "select", opcoes: [["", "Todas"], ["em andamento", "Em andamento"], ["concluido", "Concluído"], ["arquivado", "Arquivado"]], valor: f.status})}</div></div>
    <div class="card tabela-wrap"><table><tr><th>Processo</th><th>Assunto</th><th>Requerente</th><th>Responsável</th><th>Limite</th><th>Sinal</th></tr>
      ${lista.map(x=>`<tr><td><a href="#/processo/${encodeURIComponent(x.p.id_processo)}">${esc(x.p.numero_processo)}</a></td><td>${esc(x.p.assunto)}</td>
        <td>${esc(x.p.requerente)}</td><td>${esc(x.resp || "—")}</td><td>${dataCurtaBR(x.limite)}</td>
        <td><span class="selo ${gdSelo(x.sinal)}">${esc(GD_SINAL[x.sinal])}</span></td></tr>`).join("")
        || '<tr><td colspan="6" class="vazio">Nenhum processo com estes filtros.</td></tr>'}</table></div>`;
};
TELAS_DEPOIS["#/processos"] = ()=>{
  const f = gdFiltros();
  [["gdBusca", "busca", "change"], ["gdSinal", "sinal", "input"], ["gdStatus", "status", "input"]].forEach(([id, k, ev])=>
    $("#" + id).addEventListener(ev, e=>{ f[k] = e.target.value; navegar(); }));
};

TELAS["#/processo/novo"] = async ()=>{
  const us = await db.list("usuarios");
  return `<h1>Cadastrar processo</h1><p class="sub">Todos os anexos obrigatórios precisam estar presentes (RN01). O número de autuação é gerado no formato AAAA.NNNN-SD (RN02).</p>
    <form class="card" id="formGdNovo" novalidate><div class="campos">
      ${campo("gdNumero", "Número do processo", {ajuda: "Deixe em branco para gerar automaticamente."})}
      ${campo("gdData", "Data de autuação", {tipo: "date", valor: hojeISO(), obrigatorio: true})}
      ${campo("gdPrazo", "Prazo (dias corridos)", {tipo: "number", valor: GD_PRAZO, attrs: 'min="1" step="1"', obrigatorio: true})}
      ${campo("gdResponsavel", "Responsável pela instrução", {tipo: "select", opcoes: [["", "Escolha"], ...us.map(u=>[u.id_usuario, u.nome])]})}</div>
    ${campo("gdAssunto", "Assunto", {obrigatorio: true})}
    <div class="campos">${campo("gdRequerente", "Requerente (nome fictício)", {obrigatorio: true})}${campo("gdLotacao", "Lotação de destino", {obrigatorio: true})}</div>
    <fieldset class="card"><legend><b>Anexos obrigatórios (RN01)</b></legend>
      ${GD_ANEXOS.map((a, i)=>`<label style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" class="gdAnexo" id="gdAnexo${i}" style="width:auto"> <span>${esc(a)}</span></label>`).join("")}</fieldset>
    <div id="gdErros"></div><div class="linha-botoes"><button class="prim" type="submit">Autuar processo</button></div></form>`;
};
TELAS_DEPOIS["#/processo/novo"] = ()=>{
  $("#formGdNovo").addEventListener("submit", async e=>{
    e.preventDefault();
    const ps = await db.list("processos"), ano = (valorDe("gdData") || hojeISO()).slice(0, 4);
    const d = {numero_processo: valorDe("gdNumero") || gdNumero(ano, ps.length + 1), assunto: valorDe("gdAssunto"), requerente: valorDe("gdRequerente"),
      lotacao: valorDe("gdLotacao"), data_autuacao: valorDe("gdData"), dias_prazo: Number(valorDe("gdPrazo")), responsavel: valorDe("gdResponsavel")};
    const anexos = GD_ANEXOS.filter((_, i)=>$("#gdAnexo" + i).checked), erros = [];
    if (!d.assunto) erros.push("Informe o assunto.");
    if (!d.requerente) erros.push("Informe o requerente.");
    if (!d.lotacao) erros.push("Informe a lotação de destino.");
    if (!d.data_autuacao || d.data_autuacao > hojeISO()) erros.push("Informe a data de autuação (não pode ser futura).");
    if (!(d.dias_prazo > 0)) erros.push("O prazo precisa ser de pelo menos 1 dia.");
    if (anexos.length < GD_ANEXOS.length) erros.push(`Faltam anexos obrigatórios: ${GD_ANEXOS.filter(a=>!anexos.includes(a)).join(", ")} (RN01).`);
    if (ps.some(p=>normalizar(p.numero_processo) === normalizar(d.numero_processo))) erros.push("Este número de processo já está cadastrado.");
    if (d.responsavel && normalizar(d.responsavel) === normalizar(d.requerente)) erros.push("O requerente não pode ser o responsável pela instrução (RN05).");
    if (!mostrarErros("#gdErros", erros)) return;
    const id = "PR-" + String(ps.length + 1).padStart(4, "0");
    await db.put("processos", {id_processo: id, ...d, anexos, status: "em andamento", criado_em: agora()});
    for (const a of anexos) await db.put("documentos", {id_documento: uuid(), processo_id: id, tipo_documento: a, data_criacao: agora(), assinado: false});
    await db.put("log", {id: uuid(), processo_id: id, tipo_evento: "autuação", descricao: `${d.numero_processo} · ${d.assunto}`, perfil: estado.perfil || "", data_hora: agora()});
    await registrar("processo autuado", {detalhe: d.numero_processo});
    toast(`Processo ${d.numero_processo} autuado.`); location.hash = "#/processo/" + encodeURIComponent(id);
  });
};

TELAS["#/processo/:id"] = async ({id})=>{
  const p = await db.get("processos", id);
  if (!p) return `<div class="card vazio">Processo não encontrado. <a href="#/processos">Voltar</a></div>`;
  const us = await gdUsuarios(), pr = gdPrazo(p), docs = await db.porIndice("documentos", "processo_id", id);
  const ls = (await db.porIndice("log", "processo_id", id)).sort((a, b)=>b.data_hora.localeCompare(a.data_hora));
  return `<h1>${esc(p.numero_processo)} <span class="selo ${gdSelo(pr.sinal)}" id="gdSinalAtual">${esc(GD_SINAL[pr.sinal])}</span></h1>
    <p class="sub">${esc(p.assunto)} · autuado em ${dataCurtaBR(p.data_autuacao)} · prazo de ${pr.dias} dias</p>
    <div class="grade"><div class="card kpi"><div class="v" id="gdPct">${pr.pct}%</div><div class="r">do prazo decorrido</div></div>
      <div class="card kpi"><div class="v">${dataCurtaBR(pr.limite)}</div><div class="r">data limite</div></div>
      <div class="card kpi"><div class="v">${esc(us[p.responsavel]?.nome || p.responsavel || "—")}</div><div class="r">responsável pela instrução</div></div></div>
    <div class="card"><h2 style="margin-top:0">Dados</h2><p>Requerente: ${esc(p.requerente)} · Lotação: ${esc(p.lotacao)} · Situação: <b>${esc(p.status)}</b></p>
      <h2>Documentos</h2><ul>${docs.map(d=>`<li>${esc(d.tipo_documento)} · ${dataCurtaBR(d.data_criacao)} · ${d.assinado ? "assinado" : "sem assinatura"}</li>`).join("") || '<li class="sub">Nenhum.</li>'}</ul></div>
    <div class="card tabela-wrap"><h2 style="margin-top:0">Histórico</h2><table><tr><th>Data e hora</th><th>Evento</th><th>Descrição</th></tr>
      ${ls.map(x=>`<tr><td>${dataBR(x.data_hora)}</td><td>${esc(x.tipo_evento)}</td><td>${esc(x.descricao)}</td></tr>`).join("")}</table></div>`;
};
